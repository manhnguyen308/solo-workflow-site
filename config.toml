# Production baseURL is supplied at build time in Cloudflare:
# hugo --minify --gc --baseURL "${SITE_URL:-$CF_PAGES_URL}"
baseURL = "/"
languageCode = "en-us"
title = "SoloOpsGuide"
enableRobotsTXT = true
summaryLength = 28
disableKinds = ["taxonomy", "term"]

[pagination]
  pagerSize = 10

[params]
  brandName = "SoloOpsGuide"
  siteDescription = "Workflow-first guidance for freelancers, consultants, and solo operators building calmer client operations."
  defaultImage = "/og-default.svg"
  defaultImageSource = "/images/features/site/soloopsguide-home.svg"
  author = "SoloOpsGuide"

  [params.measurement]
    enabled = true
    provider = ""
    googleAnalyticsId = ""
    plausibleDomain = ""
    plausibleScript = "https://plausible.io/js/script.js"
    umamiWebsiteId = ""
    umamiScript = ""

  [params.searchConsole]
    googleSiteVerification = ""

  [params.monetization]
    adsensePublisherId = ""
    affiliateDisclosuresReady = false

[permalinks]
  client-workflow-systems = "/workflows/:slug/"
  software-stack-blueprints = "/guides/:slug/"
  workflow-comparisons = "/comparisons/:slug/"
  templates-checklists = "/templates/:slug/"
  glossary = "/glossary/:slug/"
  faq = "/faq/:slug/"

[outputs]
  home = ["HTML", "RSS", "SearchIndex"]
  section = ["HTML", "RSS"]

[outputFormats]
  [outputFormats.SearchIndex]
    mediaType = "application/json"
    baseName = "search-index"
    isPlainText = true
    notAlternative = true

[related]
  includeNewer = true
  threshold = 80
  toLower = true
  [[related.indices]]
    name = "tags"
    weight = 80
  [[related.indices]]
    name = "category"
    weight = 40

[[menu.main]]
  name = "Workflows"
  url = "/client-workflow-systems/"
  weight = 10
[[menu.main]]
  name = "Blueprints"
  url = "/software-stack-blueprints/"
  weight = 20
[[menu.main]]
  name = "Comparisons"
  url = "/workflow-comparisons/"
  weight = 30
[[menu.main]]
  name = "Templates"
  url = "/templates-checklists/"
  weight = 40
[[menu.main]]
  name = "Glossary"
  url = "/glossary/"
  weight = 50
[[menu.main]]
  name = "FAQ"
  url = "/faq/"
  weight = 60

[[menu.footer]]
