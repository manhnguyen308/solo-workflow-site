<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" role="img" aria-labelledby="title desc">
  <title id="title">Client onboarding workflow illustration</title>
  <desc id="desc">An editorial illustration showing a handoff chain, kickoff packet, and first-milestone activation in a sequential onboarding layout.</desc>
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#eff8f8" />
      <stop offset="100%" stop-color="#f7fbfd" />
    </linearGradient>
    <linearGradient id="teal" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f8b8d" />
      <stop offset="100%" stop-color="#0b6d71" />
    </linearGradient>
  </defs>
  <rect width="1600" height="900" fill="url(#bg)" />
  <circle cx="1300" cy="170" r="145" fill="#dff3f2" />
  <circle cx="240" cy="730" r="170" fill="#eef4fb" />
  <rect x="110" y="124" width="1380" height="652" rx="42" fill="#ffffff" stroke="#d6e3ea" stroke-width="4" />

  <text x="184" y="220" font-family="Segoe UI, Arial, sans-serif" font-size="30" font-weight="700" fill="#122838">Onboarding path</text>
  <rect x="184" y="238" width="270" height="22" rx="11" fill="#173042" opacity=".12" />

  <rect x="184" y="300" width="190" height="64" rx="24" fill="#ffffff" stroke="#d9e5ec" stroke-width="3" />
  <rect x="446" y="300" width="190" height="64" rx="24" fill="#ffffff" stroke="#d9e5ec" stroke-width="3" />
  <rect x="708" y="300" width="190" height="64" rx="24" fill="#fff0db" />
  <rect x="970" y="300" width="190" height="64" rx="24" fill="#d8f3f1" />
  <rect x="1232" y="300" width="190" height="64" rx="24" fill="#102430" />
  <text x="234" y="339" font-family="Segoe UI, Arial, sans-serif" font-size="15" font-weight="700" fill="#334b5c">proposal</text>
  <text x="499" y="339" font-family="Segoe UI, Arial, sans-serif" font-size="15" font-weight="700" fill="#334b5c">access</text>
  <text x="746" y="339" font-family="Segoe UI, Arial, sans-serif" font-size="15" font-weight="700" fill="#8a5d27">kickoff</text>
  <text x="1019" y="339" font-family="Segoe UI, Arial, sans-serif" font-size="15" font-weight="700" fill="#0f766e">client</text>
  <text x="1287" y="339" font-family="Segoe UI, Arial, sans-serif" font-size="15" font-weight="700" fill="#d6faf5">milestone 1</text>
  <path d="M374 332h72M636 332h72M898 332h72M1160 332h72" stroke="#0f8b8d" stroke-width="8" stroke-linecap="round" />
  <path d="M426 332l-16-16m16 16l-16 16M688 332l-16-16m16 16l-16 16M950 332l-16-16m16 16l-16 16M1212 332l-16-16m16 16l-16 16" stroke="#0f8b8d" stroke-width="8" stroke-linecap="round" stroke-linejoin="round" />

  <rect x="184" y="430" width="520" height="258" rx="30" fill="#f8fbfd" stroke="#d9e5ec" stroke-width="3" />
  <text x="226" y="478" font-family="Segoe UI, Arial, sans-serif" font-size="24" font-weight="700" fill="#122838">Kickoff packet</text>
  <rect x="226" y="498" width="218" height="20" rx="10" fill="#173042" opacity=".12" />
  <rect x="226" y="546" width="420" height="58" rx="20" fill="#ffffff" stroke="#d9e5ec" stroke-width="3" />
  <rect x="226" y="620" width="420" height="28" rx="14" fill="#ffffff" stroke="#d9e5ec" stroke-width="3" />
  <text x="260" y="580" font-family="Segoe UI, Arial, sans-serif" font-size="15" font-weight="700" fill="#334b5c">scope, timeline, files, owner</text>
  <text x="260" y="640" font-family="Segoe UI, Arial, sans-serif" font-size="13" font-weight="700" fill="#496071">approval owner + update rhythm</text>

  <rect x="764" y="430" width="658" height="258" rx="30" fill="url(#teal)" opacity=".96" />
  <text x="808" y="478" font-family="Segoe UI, Arial, sans-serif" font-size="24" font-weight="700" fill="#ffffff">First milestone activation</text>
  <rect x="808" y="498" width="250" height="20" rx="10" fill="#d6faf5" opacity=".2" />
  <rect x="808" y="546" width="180" height="96" rx="22" fill="#d6faf5" opacity=".14" />
  <rect x="1012" y="546" width="180" height="96" rx="22" fill="#d6faf5" opacity=".14" />
  <rect x="1216" y="546" width="164" height="96" rx="22" fill="#fff0db" opacity=".9" />
  <text x="846" y="580" font-family="Segoe UI, Arial, sans-serif" font-size="14" font-weight="700" fill="#d6faf5">delivery</text>
  <text x="1052" y="580" font-family="Segoe UI, Arial, sans-serif" font-size="14" font-weight="700" fill="#d6faf5">review</text>
  <text x="1252" y="580" font-family="Segoe UI, Arial, sans-serif" font-size="14" font-weight="700" fill="#8a5d27">invoice</text>
  <rect x="842" y="600" width="108" height="14" rx="7" fill="#d6faf5" opacity=".8" />
  <rect x="1048" y="600" width="108" height="14" rx="7" fill="#d6faf5" opacity=".8" />
  <rect x="1248" y="600" width="104" height="14" rx="7" fill="#b8823f" opacity=".4" />
</svg>
