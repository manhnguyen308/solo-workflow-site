<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" role="img" aria-labelledby="title desc">
  <title id="title">Change request workflow illustration</title>
  <desc id="desc">An editorial illustration showing a change request as a branching decision tree with impact and outcome paths.</desc>
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f8fafc" />
      <stop offset="100%" stop-color="#f3f9fb" />
    </linearGradient>
  </defs>
  <rect width="1600" height="900" fill="url(#bg)" />
  <circle cx="1280" cy="180" r="150" fill="#e9f4fb" />
  <rect x="120" y="124" width="1360" height="652" rx="42" fill="#ffffff" stroke="#d8e5ec" stroke-width="4" />

  <text x="188" y="220" font-family="Segoe UI, Arial, sans-serif" font-size="30" font-weight="700" fill="#122838">Change decision tree</text>
  <rect x="188" y="238" width="250" height="22" rx="11" fill="#173042" opacity=".12" />

  <rect x="620" y="204" width="360" height="118" rx="30" fill="#f8fbfd" stroke="#d9e5ec" stroke-width="3" />
  <text x="668" y="248" font-family="Segoe UI, Arial, sans-serif" font-size="18" font-weight="700" fill="#334b5c">requested change</text>
  <rect x="668" y="272" width="174" height="14" rx="7" fill="#173042" opacity=".12" />

  <path d="M800 322v90" stroke="#0f8b8d" stroke-width="8" stroke-linecap="round" />
  <path d="M800 398l-14-14m14 14l-14 14" stroke="#0f8b8d" stroke-width="8" stroke-linecap="round" stroke-linejoin="round" />

  <polygon points="800,410 950,520 800,630 650,520" fill="#102430" />
  <text x="742" y="518" font-family="Segoe UI, Arial, sans-serif" font-size="17" font-weight="700" fill="#d6faf5">scope?</text>
  <text x="728" y="546" font-family="Segoe UI, Arial, sans-serif" font-size="14" font-weight="700" fill="#d6faf5">fee?</text>

  <path d="M650 520H360M950 520h290M800 630v72M800 410v-12" stroke="#c9934a" stroke-width="8" stroke-linecap="round" />

  <rect x="180" y="470" width="180" height="100" rx="26" fill="#ecfdf3" />
  <rect x="1240" y="470" width="180" height="100" rx="26" fill="#fff0db" />
  <rect x="710" y="720" width="180" height="100" rx="26" fill="#dfe9fb" />
  <rect x="710" y="90" width="180" height="86" rx="26" fill="#fee2e2" opacity="0" />
  <text x="231" y="518" font-family="Segoe UI, Arial, sans-serif" font-size="16" font-weight="700" fill="#15803d">included</text>
  <text x="1284" y="518" font-family="Segoe UI, Arial, sans-serif" font-size="16" font-weight="700" fill="#8a5d27">repriced</text>
  <text x="763" y="768" font-family="Segoe UI, Arial, sans-serif" font-size="16" font-weight="700" fill="#36589a">deferred</text>

  <rect x="700" y="660" width="200" height="34" rx="17" fill="#fee2e2" />
  <text x="752" y="682" font-family="Segoe UI, Arial, sans-serif" font-size="14" font-weight="700" fill="#b91c1c">decline if needed</text>
  <rect x="710" y="780" width="180" height="18" rx="9" fill="#36589a" opacity=".18" />
  <text x="744" y="538" font-family="Segoe UI, Arial, sans-serif" font-size="12" font-weight="700" fill="#d6faf5">approval owner</text>
</svg>
