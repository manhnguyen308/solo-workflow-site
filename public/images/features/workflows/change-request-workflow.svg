  <text x="1126" y="426" font-family="Segoe UI, Arial, sans-serif" font-size="13" font-weight="700" fill="#15803d">included</text>
  <text x="1276" y="426" font-family="Segoe UI, Arial, sans-serif" font-size="13" font-weight="700" fill="#8a5d27">repriced</text>
  <text x="1127" y="478" font-family="Segoe UI, Arial, sans-serif" font-size="13" font-weight="700" fill="#36589a">deferred</text>
  <text x="1282" y="478" font-family="Segoe UI, Arial, sans-serif" font-size="13" font-weight="700" fill="#b91c1c">declined</text>
  <rect x="1090" y="536" width="282" height="90" rx="22" fill="#ffffff" stroke="#d9e5ec" stroke-width="3" />
  <text x="1122" y="572" font-family="Segoe UI, Arial, sans-serif" font-size="15" font-weight="700" fill="#334b5c">update delivery + invoice</text>
  <rect x="1122" y="592" width="168" height="14" rx="7" fill="#173042" opacity=".12" />
  <path d="M550 450h70" stroke="#0f8b8d" stroke-width="8" stroke-linecap="round" />
  <path d="M980 450h70" stroke="#c9934a" stroke-width="8" stroke-linecap="round" />
  <path d="M596 450l-16-16m16 16l-16 16" stroke="#0f8b8d" stroke-width="8" stroke-linecap="round" stroke-linejoin="round" />
  <path d="M1026 450l-16-16m16 16l-16 16" stroke="#c9934a" stroke-width="8" stroke-linecap="round" stroke-linejoin="round" />
</svg>
