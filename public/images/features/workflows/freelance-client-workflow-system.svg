  <text x="681" y="586" font-family="Segoe UI, Arial, sans-serif" font-size="14" font-weight="700" fill="#d6faf5">status</text>
  <text x="856" y="586" font-family="Segoe UI, Arial, sans-serif" font-size="14" font-weight="700" fill="#8a5d27">payment due</text>
  <rect x="492" y="606" width="86" height="12" rx="6" fill="#d6faf5" opacity=".8" />
  <rect x="672" y="606" width="86" height="12" rx="6" fill="#d6faf5" opacity=".8" />
  <rect x="852" y="606" width="92" height="12" rx="6" fill="#b8823f" opacity=".42" />

  <rect x="1060" y="440" width="346" height="250" rx="32" fill="#f8fbfd" stroke="#d9e5ec" stroke-width="3" />
