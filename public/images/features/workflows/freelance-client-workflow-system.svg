  <rect x="1102" y="602" width="262" height="40" rx="20" fill="#ffffff" stroke="#d9e5ec" stroke-width="3" />
  <text x="1134" y="573" font-family="Segoe UI, Arial, sans-serif" font-size="14" font-weight="700" fill="#334b5c">owner named before kickoff</text>
  <text x="1134" y="627" font-family="Segoe UI, Arial, sans-serif" font-size="14" font-weight="700" fill="#334b5c">invoice tied to milestone</text>
  <circle cx="1330" cy="568" r="10" fill="#0f8b8d" />
  <circle cx="1330" cy="622" r="10" fill="#0f8b8d" />
