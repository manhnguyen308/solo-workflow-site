  <rect x="206" y="390" width="104" height="70" rx="22" fill="#d6faf5" opacity=".12" />
  <rect x="206" y="478" width="104" height="70" rx="22" fill="#d6faf5" opacity=".12" />
  <rect x="206" y="566" width="104" height="70" rx="22" fill="#d6faf5" opacity=".12" />
  <text x="233" y="344" font-family="Segoe UI, Arial, sans-serif" font-size="14" font-weight="700" fill="#d6faf5">intake</text>
  <text x="224" y="432" font-family="Segoe UI, Arial, sans-serif" font-size="14" font-weight="700" fill="#d6faf5">handoff</text>
  <text x="215" y="520" font-family="Segoe UI, Arial, sans-serif" font-size="14" font-weight="700" fill="#d6faf5">delivery</text>
  <text x="224" y="608" font-family="Segoe UI, Arial, sans-serif" font-size="14" font-weight="700" fill="#d6faf5">billing</text>
  <path d="M258 372v18m0 70v18m0 70v18" stroke="#d6faf5" stroke-width="6" stroke-linecap="round" opacity=".45" />

  <text x="412" y="214" font-family="Segoe UI, Arial, sans-serif" font-size="30" font-weight="700" fill="#122838">Inquiry to final payment</text>
