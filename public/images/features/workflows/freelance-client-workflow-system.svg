  <text x="632" y="347" font-family="Segoe UI, Arial, sans-serif" font-size="14" font-weight="700" fill="#36589a">proposal</text>
  <text x="795" y="347" font-family="Segoe UI, Arial, sans-serif" font-size="14" font-weight="700" fill="#8a5d27">onboard</text>
  <text x="953" y="347" font-family="Segoe UI, Arial, sans-serif" font-size="14" font-weight="700" fill="#18794e">deliver</text>
