<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" role="img" aria-labelledby="title desc">
  <title id="title">Freelance client workflow system illustration</title>
  <desc id="desc">An editorial workflow illustration showing six connected client stages, handoff checkpoints, and an operating board from inquiry through final payment.</desc>
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f4fbfb" />
      <stop offset="100%" stop-color="#eef5fb" />
    </linearGradient>
    <linearGradient id="lane" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f8b8d" />
      <stop offset="100%" stop-color="#0b6d71" />
    </linearGradient>
    <linearGradient id="panel" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#113247" />
      <stop offset="100%" stop-color="#102430" />
    </linearGradient>
  </defs>
  <rect width="1600" height="900" fill="url(#bg)" />
  <circle cx="1370" cy="180" r="158" fill="#dff4f2" />
  <circle cx="248" cy="738" r="160" fill="#e6f0fb" />

  <rect x="112" y="118" width="1376" height="664" rx="42" fill="#ffffff" stroke="#d9e5ec" stroke-width="4" />

