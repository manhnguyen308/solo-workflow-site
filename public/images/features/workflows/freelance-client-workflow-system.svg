  <rect x="412" y="440" width="612" height="250" rx="32" fill="url(#lane)" />
  <text x="456" y="490" font-family="Segoe UI, Arial, sans-serif" font-size="25" font-weight="700" fill="#ffffff">Live operating board</text>
