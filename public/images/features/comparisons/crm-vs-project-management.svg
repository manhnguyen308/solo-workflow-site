  <rect x="904" y="328" width="176" height="52" rx="26" fill="#dfe9fb" />
  <text x="286" y="362" font-family="Arial, sans-serif" font-size="24" font-weight="700" fill="#0f8b8d">CRM-first</text>
  <text x="946" y="362" font-family="Arial, sans-serif" font-size="24" font-weight="700" fill="#36589a">PM-first</text>

  <rect x="252" y="430" width="194" height="88" rx="30" fill="#ffffff" opacity=".12" />
  <rect x="476" y="430" width="194" height="88" rx="30" fill="#ffffff" opacity=".12" />
  <rect x="904" y="430" width="194" height="88" rx="30" fill="#fff1db" />
