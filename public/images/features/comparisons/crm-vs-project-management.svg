  <text x="944" y="484" font-family="Arial, sans-serif" font-size="28" font-weight="700" fill="#8a5d27">Delivery truth</text>
  <text x="1176" y="484" font-family="Arial, sans-serif" font-size="28" font-weight="700" fill="#18794e">Owners</text>

