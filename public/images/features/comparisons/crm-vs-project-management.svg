<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" role="img" aria-labelledby="title desc">
  <title id="title">CRM versus project management comparison</title>
  <desc id="desc">A premium comparison diagram with two balanced panels, readable labels, and connector lines placed away from text to compare CRM-first and project-management-first workflows.</desc>
  <defs>
    <linearGradient id="compare-bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fbf7f0" />
      <stop offset="100%" stop-color="#f0f5fb" />
    </linearGradient>
  </defs>
  <rect width="1600" height="900" fill="url(#compare-bg)" />
  <circle cx="1284" cy="170" r="150" fill="#dfe9fb" opacity=".62" />
  <circle cx="262" cy="736" r="144" fill="#d8f3f1" opacity=".82" />

  <rect x="108" y="92" width="1384" height="716" rx="46" fill="#ffffff" stroke="#d9e5ec" stroke-width="4" />
  <text x="170" y="182" font-family="Georgia, 'Times New Roman', serif" font-size="42" fill="#122838">CRM vs PM</text>
  <rect x="170" y="198" width="190" height="18" rx="9" fill="#122838" opacity=".10" />

  <rect x="170" y="246" width="1260" height="492" rx="42" fill="#ffffff" stroke="#d9e5ec" stroke-width="3" />
  <rect x="214" y="296" width="520" height="368" rx="38" fill="#17355f" />
  <rect x="866" y="296" width="520" height="368" rx="38" fill="#f8fbfd" stroke="#d9e5ec" stroke-width="3" />

