<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>

<style>
  *, *::before, *::after { box-sizing: border-box; }
  html { font-size: 16px; scroll-behavior: smooth; }
  body {
    margin: 0;
    background: #fafbfc;
    color: #334155;
    font-family: "Source Sans 3","Helvetica Neue",Arial,sans-serif;
    line-height: 1.6;
  }
  img { display: block; max-width: 100%; }
  a { color: #0b6d71; text-underline-offset: 0.18em; }
  p, ul, ol { margin: 0 0 1.2rem; }
  ul, ol { padding-left: 1.25rem; }
  li + li { margin-top: 0.45rem; }
  nav li + li { margin-top: 0; }
  nav ul { padding-left: 0; }
  h1,h2,h3,h4,h5,h6 {
    margin: 0 0 1rem;
    color: #0f172a;
    font-family: "Source Sans 3","Helvetica Neue",Arial,sans-serif;
    letter-spacing: -0.03em;
    line-height: 1.08;
  }

  /* ─── Mobile nav (matches production .site-header / .nav-open / data-nav-toggle / .header-actions) ─── */
  /* Desktop: hide the toggle, show header-actions inline. The header-actions row is laid out by inline styles above. */
  .site-header .nav-toggle { display: none; }

  @media (max-width: 820px) {
    /* Wrap the top row so the brand + toggle sit on line 1 and header-actions can drop below */
    .site-header .header-top { flex-wrap: wrap !important; gap: 0.75rem !important; }

    /* Toggle button visible at mobile widths */
    .site-header .nav-toggle {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      width: 2.75rem;
      height: 2.75rem;
      padding: 0;
      border: 1px solid rgba(226,232,240,1);
      border-radius: 10px;
      background: #ffffff;
      color: #0f172a;
      cursor: pointer;
      flex-shrink: 0;
      font-family: inherit;
    }
    .site-header .nav-toggle:hover { background: #f8fafc; }
    .site-header .nav-toggle:focus-visible { outline: 2px solid #0d9488; outline-offset: 2px; }
    .site-header .nav-toggle .bars,
    .site-header .nav-toggle .bars::before,
    .site-header .nav-toggle .bars::after {
      display: block;
      width: 18px;
      height: 2px;
      background: currentColor;
      border-radius: 2px;
      transition: transform 160ms ease, opacity 160ms ease;
    }
    .site-header .nav-toggle .bars { position: relative; }
    .site-header .nav-toggle .bars::before { content: ""; position: absolute; left: 0; top: -6px; }
    .site-header .nav-toggle .bars::after  { content: ""; position: absolute; left: 0; top:  6px; }
    .site-header.nav-open .nav-toggle .bars { background: transparent; }
    .site-header.nav-open .nav-toggle .bars::before { transform: translateY(6px) rotate(45deg); }
    .site-header.nav-open .nav-toggle .bars::after  { transform: translateY(-6px) rotate(-45deg); }

    /* Brand: drop the tagline at mobile so the row stays compact */
    .site-header .brand-tagline { display: none !important; }

    /* Closed state: collapse the nav + CTA group */
    .site-header .header-actions {
      display: none !important;
      flex: 1 1 100% !important;
      width: 100%;
      flex-direction: column !important;
      align-items: stretch !important;
      gap: 0.25rem !important;
      padding-bottom: 0.75rem;
    }
    .site-header.nav-open .header-actions { display: flex !important; }

    /* Stacked nav links */
    .site-header.nav-open .header-actions nav { flex: 1 1 auto !important; width: 100%; }
    .site-header.nav-open .header-actions nav ul {
      flex-direction: column !important;
      align-items: stretch !important;
      gap: 0 !important;
      width: 100%;
    }
    .site-header.nav-open .header-actions nav li { width: 100%; }
    .site-header.nav-open .header-actions nav a {
      width: 100%;
      height: 2.75rem !important;
      padding: 0 0.85rem !important;
      border-radius: 8px;
    }

    /* CTA stays present but does NOT dominate: full-width, calmer height, separated from links by a hairline */
    .site-header.nav-open .header-actions .header-cta {
      width: 100%;
      justify-content: center;
      margin-top: 0.5rem;
      padding-top: 0.75rem;
      border-top: 1px solid rgba(226,232,240,1);
      border-radius: 10px 10px 10px 10px;
      background: transparent !important;
      color: #0d9488 !important;
      box-shadow: none;
    }
    .site-header.nav-open .header-actions .header-cta::after { content: " →"; }

    /* Search bar: keep visible at mobile widths, just snug */
    .site-header .header-search { padding-bottom: 0.9rem; }
    .site-header .header-search input { height: 2.75rem !important; }
  }

  /* Prevent any rogue horizontal overflow at narrow widths */
  html, body { max-width: 100%; overflow-x: hidden; }
</style>

  { key:"blueprints",  label:"Blueprints",             desc:"Use these when the workflow is clear but the stack still feels too heavy.",       count:8,  color:"#24518b", bg:"linear-gradient(180deg,#eff6ff,#dbeafe)" },

  { key:"templates",   label:"Templates & Checklists", desc:"Use these after the rule is clear and you need an asset for a real trigger.",     count:9,  color:"#0f766e", bg:"linear-gradient(180deg,#f0fdfa,#ccfbf1)" },

  { title:"How to Build a Client Intake and Qualification Workflow",    summary:"Standardize the intake stage to filter better-fit clients earlier.",  type:"workflow",    tag:"How-to",       date:"Dec 15, 2024" },

  { title:"Client Onboarding Checklist for Freelancers",                summary:"An execution checklist for the kickoff trigger moment.",                type:"template",    tag:"Checklist",    date:"Sep 18, 2024" },
  { title:"Notion vs ClickUp for Solo Client Delivery",                 summary:"A bounded comparison between two common project management tools.",     type:"comparison",  tag:"Tool decision", date:"Aug 22, 2024" },

/* ─── Page card themes ─── */
const CARD_THEMES = {
  workflow:   { media:"linear-gradient(135deg,rgba(15,139,141,0.26),rgba(8,92,110,0.78))",    typeColor:"#0f766e",  linkLabel:"Read workflow" },
  blueprint:  { media:"linear-gradient(135deg,rgba(31,112,149,0.22),rgba(17,38,52,0.78))",   typeColor:"#1d6fa4",  linkLabel:"Open blueprint" },
  comparison: { media:"linear-gradient(135deg,rgba(184,130,63,0.26),rgba(104,78,54,0.72))",  typeColor:"#9a6b33",  linkLabel:"Read comparison" },
  template:   { media:"linear-gradient(135deg,rgba(15,139,141,0.18),rgba(184,130,63,0.42))", typeColor:"#0f766e",  linkLabel:"Open asset" },
  glossary:   { media:"linear-gradient(135deg,rgba(65,87,106,0.2),rgba(17,38,52,0.68))",     typeColor:"#475569",  linkLabel:"View term" },
  faq:        { media:"linear-gradient(135deg,rgba(65,87,106,0.2),rgba(17,38,52,0.68))",     typeColor:"#475569",  linkLabel:"View answer" },
};

/* ─── PageCard ─── */
function PageCard({ title, summary, type="workflow", tag, date="Jan 2, 2025", featured=false, onClick }) {
  const [hov, setHov] = React.useState(false);
  const theme = CARD_THEMES[type] || CARD_THEMES.workflow;
  const typeLabel = type.charAt(0).toUpperCase() + type.slice(1);
  return (
    <article onClick={onClick}
      onMouseEnter={() => setHov(true)} onMouseLeave={() => setHov(false)}
      style={{
        overflow:"hidden", borderRadius:"16px", background:"#f8fafc", cursor:onClick?"pointer":"default", display:"grid",
        border:`1px solid ${hov?"rgba(203,213,225,1)":"rgba(226,232,240,1)"}`,
        boxShadow: hov?"0 10px 24px rgba(15,23,42,0.08)":"0 1px 2px rgba(15,23,42,0.04)",
        transform: hov?"translateY(-1px)":"translateY(0)",
        transition:"transform 180ms ease,box-shadow 180ms ease,border-color 180ms ease",
        fontFamily: FONT_UI,
      }}>
      <div style={{ aspectRatio:"16/9", background:theme.media }}></div>
      <div style={{ display:"grid", gap:"0.85rem", padding: featured?"1.75rem":"1.5rem" }}>
        <div style={{ display:"flex", alignItems:"center", justifyContent:"space-between" }}>
          <span style={{ fontSize:"11px", fontWeight:700, letterSpacing:"0.06em", textTransform:"uppercase", color:theme.typeColor }}>{typeLabel}</span>
          <span style={{ fontSize:"13px", color:"#64748b" }}>{date}</span>
        </div>
        <h3 style={{ margin:0, fontSize:featured?"22px":"18px", fontWeight:600, lineHeight:1.3, letterSpacing:"-0.02em", color:"#0f172a", fontFamily:FONT_UI }}>{title}</h3>
        {summary && <p style={{ margin:0, fontSize:"14px", lineHeight:1.65, color:"#475569" }}>{summary}</p>}
        <div style={{ display:"flex", alignItems:"center", justifyContent:"space-between" }}>
          {tag && <span style={{ display:"inline-flex", alignItems:"center", padding:"0.22rem 0.55rem", border:"1px solid rgba(226,232,240,1)", borderRadius:"999px", background:"#fff", color:"#475569", fontSize:"12px", fontWeight:600 }}>{tag}</span>}
          <span style={{ marginLeft:"auto", fontSize:"14px", fontWeight:500, color:"#0f766e" }}>{theme.linkLabel}</span>
        </div>
      </div>
    </article>
  );
}

/* ─── Header ─── */
function Header({ activePage="" }) {
  const [navOpen, setNavOpen] = React.useState(false);

  // Close nav on resize up to desktop, and on Escape
  React.useEffect(() => {
    const onResize = () => { if (window.innerWidth > 820) setNavOpen(false); };
    const onKey = (e) => { if (e.key === "Escape") setNavOpen(false); };
    window.addEventListener("resize", onResize);
    window.addEventListener("keydown", onKey);
    return () => { window.removeEventListener("resize", onResize); window.removeEventListener("keydown", onKey); };
  }, []);

  const navLinks = [
    { name:"Blueprints",  url:"/software-stack-blueprints/" },
    { name:"Comparisons", url:"/workflow-comparisons/" },
    { name:"Templates",   url:"/templates-checklists/" },
    { name:"Glossary",    url:"/glossary/" },
    { name:"FAQ",         url:"/faq/" },
  ];
  return (
    <header className={"site-header" + (navOpen ? " nav-open" : "")} style={{ background:"#fff", borderBottom:"1px solid rgba(226,232,240,0.8)", position:"sticky", top:"40px", zIndex:40, fontFamily:FONT_UI }}>
      <div style={{ width:"min(1280px,calc(100vw - 2rem))", margin:"0 auto", padding:"0 2rem" }}>
        {/* Brand + nav + CTA row */}
        <div className="header-top" style={{ display:"flex", alignItems:"center", gap:"2rem", padding:"1.1rem 0" }}>
          {/* Brand */}
          <a href="/" style={{ display:"inline-flex", alignItems:"center", gap:"0.9rem", textDecoration:"none", flexShrink:0 }}>
            <span style={{
              display:"inline-flex", alignItems:"center", justifyContent:"center",
              width:"2.75rem", height:"2.75rem", borderRadius:"14px", flexShrink:0,
              background:"linear-gradient(145deg,#0f8b8d,#0b6d71)",
              boxShadow:"inset 0 1px 0 rgba(255,255,255,0.3),0 8px 20px rgba(15,23,42,0.08)",
            }}>
              <svg viewBox="0 0 64 64" width="24" height="24" fill="none" stroke="#f8fafc" strokeWidth="2.6" strokeLinecap="round" strokeLinejoin="round">
                <rect x="6" y="6" width="52" height="52" rx="16"></rect>
                <path d="M20 23h24M20 32h18M20 41h24"></path>
                <path d="M42 20l6 6-6 6"></path>
              </svg>
            </span>
            <span style={{ display:"flex", flexDirection:"column", justifyContent:"center" }}>
              <span style={{ color:"#0f172a", fontSize:"21px", fontWeight:600, lineHeight:1.15, letterSpacing:"-0.02em", fontFamily:FONT_UI }}>SoloOpsGuide</span>
              <span className="brand-tagline" style={{ color:"#64748b", fontSize:"12.5px", lineHeight:1.35, marginTop:"1px", fontFamily:FONT_UI }}>Workflow-first guidance for solo operators</span>
            </span>
          </a>

          {/* Mobile-only nav toggle (matches production data-nav-toggle pattern) */}
          <button
            type="button"
            className="nav-toggle"
            data-nav-toggle
            aria-expanded={navOpen}
            aria-controls="site-nav"
            aria-label={navOpen ? "Close menu" : "Open menu"}
            onClick={() => setNavOpen(v => !v)}
            style={{ marginLeft:"auto" }}
          >
            <span className="bars" aria-hidden="true"></span>
          </button>

          {/* Nav + CTA group — matches production .header-actions */}
          <div id="site-nav" className="header-actions" style={{ display:"flex", alignItems:"center", gap:"2rem", flex:"1 1 auto" }}>
            <nav style={{ flex:"1 1 auto" }} aria-label="Primary">
              <ul style={{ display:"flex", alignItems:"center", gap:"0", listStyle:"none", margin:0, padding:0, lineHeight:"normal" }}>

                {navLinks.map(link => {
                  const isActive = activePage === link.url;
                  return (
                    <li key={link.name} style={{ display:"flex", alignItems:"center" }}>
                      <a href={link.url} aria-current={isActive ? "page" : undefined} style={{
                        display:"inline-flex", alignItems:"center", height:"2.5rem",
                        padding:"0 0.85rem", borderRadius:"8px",
                        fontSize:"15px", fontWeight: isActive ? 600 : 400,
                        color: isActive ? "#0f172a" : "#334155",
                        textDecoration:"none", whiteSpace:"nowrap",
                        background: isActive ? "rgba(15,139,141,0.07)" : "transparent",
                        transition:"color 150ms ease,background 150ms ease",
                        fontFamily:FONT_UI,
                      }}>{link.name}</a>
                    </li>
                  );
                })}
              </ul>
            </nav>

            {/* CTA — links to workflow hub, matches real site header */}
            <a className="header-cta" href="/client-workflow-systems/" style={{
              display:"inline-flex", alignItems:"center", height:"2.5rem",
              padding:"0 1.2rem", borderRadius:"10px", flexShrink:0,
              background:"#0d9488", color:"#fff",
              fontSize:"15px", fontWeight:500, textDecoration:"none",
              whiteSpace:"nowrap", fontFamily:FONT_UI,
              transition:"background 150ms ease",
            }}>Explore workflows</a>
          </div>
        </div>

        {/* Search bar */}
        <div className="header-search" style={{ paddingBottom:"1.1rem" }}>
          <div style={{ position:"relative", maxWidth:"580px" }}>
            <span style={{ position:"absolute", left:"14px", top:"50%", transform:"translateY(-50%)", width:"16px", height:"16px", border:"2px solid #94a3b8", borderRadius:"50%", pointerEvents:"none" }}>
              <span style={{ position:"absolute", right:"-5px", bottom:"-5px", width:"6px", height:"2px", background:"#94a3b8", borderRadius:"999px", transform:"rotate(45deg)", display:"block" }}></span>
            </span>
            <input type="search" placeholder="Search workflows, blueprints, comparisons, and assets..." aria-label="Search" style={{
              width:"100%", height:"3rem", padding:"0 1rem 0 2.75rem",
              border:"1px solid rgba(226,232,240,1)", borderRadius:"10px",
              background:"#f8fafc", color:"#334155", fontSize:"15px",
              fontFamily:FONT_UI, outline:"none",
            }} />
          </div>
        </div>
      </div>
    </header>
  );
}

          <div><p style={hd}>About</p><ul style={col}>{about.map(l=><li key={l.name}><a href={l.url} style={lnk}>{l.name}</a></li>)}</ul></div>

          <h2 style={{ fontSize:"28px", fontWeight:600, letterSpacing:"-0.04em", marginBottom:"0.4rem", color:"#0f172a", fontFamily:FONT_UI }}>Start with the strongest pages in this hub</h2>
          <p style={{ color:"#475569", fontSize:"16px", margin:"0 0 1.5rem", fontFamily:FONT_UI }}>These pages carry the main lifecycle, decision, and implementation paths. Open them before drilling into narrower supporting pages.</p>
          <div style={{ display:"grid", gridTemplateColumns:"repeat(2,minmax(0,1fr))", gap:"1.5rem" }}>
            {SAMPLE_CARDS.slice(0,2).map((c,i)=><PageCard key={i} {...c} onClick={()=>onNavigate("article")} />)}
          </div>
        </div>

        {/* Supporting pages section */}
        <div>
          <p style={{ fontSize:"0.78rem", fontWeight:700, letterSpacing:"0.16em", textTransform:"uppercase", color:"#b8823f", margin:"0 0 0.4rem", fontFamily:FONT_UI }}>More pages in this hub</p>
          <h2 style={{ fontSize:"28px", fontWeight:600, letterSpacing:"-0.04em", marginBottom:"0.4rem", color:"#0f172a", fontFamily:FONT_UI }}>Supporting pages and follow-on reading</h2>
          <p style={{ color:"#475569", fontSize:"16px", margin:"0 0 1.5rem", fontFamily:FONT_UI }}>Use these after the priority set when you need a narrower workflow fix, implementation asset, or reference page inside the same cluster.</p>

      </div>

}

/* ─── Article aside tag chip (navigational topic link, not CTA) ─── */
function ArticleTagChip({ slug, label }) {
  const [hov, setHov] = React.useState(false);
  return (
    <a href={`/tags/${slug}/`} onMouseEnter={()=>setHov(true)} onMouseLeave={()=>setHov(false)} style={{
      display:"inline-flex", alignItems:"center",
      height:"24px", padding:"0 0.55rem",
      borderRadius:"999px",
      border:`1px solid ${hov ? "#0f8b8d" : "rgba(226,232,240,1)"}`,
      background: hov ? "#ccfbf1" : "#f8fafc",
      color: hov ? "#0f766e" : "#475569",
      fontSize:"12px", fontWeight:500,
      textDecoration:"none", whiteSpace:"nowrap",
      transition:"all 150ms ease", fontFamily:FONT_UI,
    }}>#{label}</a>
  );
}

/* ─────────────────────────
   APP
   ───────────────────────── */
function App() {
  const [screen, setScreen] = React.useState("home");

  /* Cross-file screen components — resolved at render time after all scripts have run */
  const GlossaryHubScreen  = window.GlossaryHubPage;
  const GlossaryTermScreen = window.GlossaryTermPage;
  const FaqHubScreen       = window.FaqHubPage;
  const FaqArticleScreen   = window.FaqArticlePage;
  const SearchScreen       = window.SearchPage;
  const ComparisonScreen   = window.ComparisonPage;
  const BlueprintScreen    = window.BlueprintPage;
  const TrustScreen        = window.TrustPage;
  const NotFoundScreen     = window.NotFoundPage;
  const TaxonomyScreen     = window.TaxonomyPage;
  const TagsIndexScreen    = window.TagsIndexPage;

  const content = {
    home:          <HomePage onNavigate={setScreen} />,
    hub:           <HubPage onNavigate={setScreen} />,
    article:       <ArticlePage onNavigate={setScreen} isTemplate={false} />,
    template:      <ArticlePage onNavigate={setScreen} isTemplate={true} />,
    comparison:    ComparisonScreen   ? <ComparisonScreen   onNavigate={setScreen} /> : null,
    blueprint:     BlueprintScreen    ? <BlueprintScreen    onNavigate={setScreen} /> : null,
    "glossary-hub":  GlossaryHubScreen  ? <GlossaryHubScreen  onNavigate={setScreen} /> : null,
    "glossary-term": GlossaryTermScreen ? <GlossaryTermScreen onNavigate={setScreen} /> : null,
    "faq-hub":       FaqHubScreen       ? <FaqHubScreen       onNavigate={setScreen} /> : null,
    "faq-article":   FaqArticleScreen   ? <FaqArticleScreen   onNavigate={setScreen} /> : null,
    "search":        SearchScreen       ? <SearchScreen       onNavigate={setScreen} /> : null,
    "trust":         TrustScreen        ? <TrustScreen        onNavigate={setScreen} /> : null,
    "not-found":     NotFoundScreen     ? <NotFoundScreen     onNavigate={setScreen} /> : null,
    "taxonomy":      TaxonomyScreen     ? <TaxonomyScreen     onNavigate={setScreen} /> : null,
    "tags-index":    TagsIndexScreen    ? <TagsIndexScreen    onNavigate={setScreen} /> : null,
  };
  return (
    <div>
      <NavTabs screen={screen} onNavigate={setScreen} />
      <Header activePage={screen==="hub" ? "/client-workflow-systems/" : screen==="blueprint" ? "/software-stack-blueprints/" : screen==="comparison" ? "/workflow-comparisons/" : screen==="glossary-hub"||screen==="glossary-term" ? "/glossary/" : screen==="faq-hub"||screen==="faq-article" ? "/faq/" : ""} />
      <main>{content[screen] || content.home}</main>
      <Footer />
    </div>
  );
}

const root = ReactDOM.createRoot(document.getElementById("root"));
root.render(<App />);
</script>
<div id="root"></div>
