<!DOCTYPE html>
<html lang="en">
<head><meta charset="UTF-8"><style>
* { box-sizing: border-box; margin: 0; padding: 0; }
body { font-family: "Segoe UI","Avenir Next","Helvetica Neue",Arial,sans-serif; background: #fafbfc; padding: 20px; }
.row { display: flex; gap: 8px; flex-wrap: wrap; }
.swatch { display: flex; flex-direction: column; gap: 6px; min-width: 80px; }
.chip { height: 56px; border-radius: 12px; border: 1px solid rgba(0,0,0,0.06); }
.label { font-size: 11px; color: #475569; line-height: 1.3; }
.name { font-size: 12px; font-weight: 600; color: #0f172a; }
.section { margin-bottom: 20px; }
.section-title { font-size: 11px; font-weight: 700; letter-spacing: 0.12em; text-transform: uppercase; color: #94a3b8; margin-bottom: 12px; }
</style></head>
<body>
<div class="section">
  <div class="section-title">Ink — Text Colors</div>
  <div class="row">
    <div class="swatch"><div class="chip" style="background:#0f172a;"></div><div class="name">Ink Alt</div><div class="label">#0f172a</div></div>
    <div class="swatch"><div class="chip" style="background:#173042;"></div><div class="name">Ink</div><div class="label">#173042</div></div>
    <div class="swatch"><div class="chip" style="background:#334155;"></div><div class="name">Ink Mid</div><div class="label">#334155</div></div>
    <div class="swatch"><div class="chip" style="background:#41576a;"></div><div class="name">Ink Soft</div><div class="label">#41576a</div></div>
    <div class="swatch"><div class="chip" style="background:#475569;"></div><div class="name">Muted Mid</div><div class="label">#475569</div></div>
    <div class="swatch"><div class="chip" style="background:#64788a;"></div><div class="name">Muted</div><div class="label">#64788a</div></div>
    <div class="swatch"><div class="chip" style="background:#94a3b8;"></div><div class="name">Muted Light</div><div class="label">#94a3b8</div></div>
  </div>
</div>
<div class="section">
  <div class="section-title">Surfaces</div>
  <div class="row">
    <div class="swatch"><div class="chip" style="background:#fafbfc;"></div><div class="name">BG</div><div class="label">#fafbfc</div></div>
    <div class="swatch"><div class="chip" style="background:#f8fafc;"></div><div class="name">BG Alt</div><div class="label">#f8fafc</div></div>
    <div class="swatch"><div class="chip" style="background:#f1f5f9;"></div><div class="name">Slate 100</div><div class="label">#f1f5f9</div></div>
    <div class="swatch"><div class="chip" style="background:#e2e8f0;"></div><div class="name">Border</div><div class="label">#e2e8f0</div></div>
    <div class="swatch"><div class="chip" style="background:#ffffff;"></div><div class="name">Surface</div><div class="label">#ffffff</div></div>
    <div class="swatch"><div class="chip" style="background:#112634;"></div><div class="name">Dark Panel</div><div class="label">#112634</div></div>
    <div class="swatch"><div class="chip" style="background:#0f172a;"></div><div class="name">Footer</div><div class="label">#0f172a</div></div>
  </div>
</div>
</body></html>
