<!DOCTYPE html>
<html lang="en">
<head><meta charset="UTF-8"><style>
* { box-sizing: border-box; margin: 0; padding: 0; }
body { font-family: "Segoe UI","Avenir Next","Helvetica Neue",Arial,sans-serif; background: #fafbfc; }
.header { background: #fff; border-bottom: 1px solid rgba(226,232,240,0.8); padding: 0 24px; }
.header-inner { display: flex; align-items: center; justify-content: space-between; gap: 20px; padding: 16px 0; }
.brand { display: inline-flex; align-items: center; gap: 12px; text-decoration: none; }
.brand-icon { display: inline-flex; align-items: center; justify-content: center; width: 42px; height: 42px; border-radius: 16px; background: linear-gradient(145deg, #0f8b8d, #0b6d71); box-shadow: inset 0 1px 0 rgba(255,255,255,0.3), 0 8px 20px rgba(15,23,42,0.08); }
.brand-icon svg { width: 26px; height: 26px; }
.brand-copy { display: flex; flex-direction: column; }
.brand-name { color: #0f172a; font-size: 20px; font-weight: 600; line-height: 1.1; letter-spacing: -0.02em; }
.brand-tagline { color: #64748b; font-size: 12px; line-height: 1.35; margin-top: 1px; }
.nav { display: flex; align-items: center; gap: 28px; }
.nav a { font-size: 14px; color: #334155; text-decoration: none; }
.nav a:hover { color: #0f172a; }
.btn-header { display: inline-flex; align-items: center; min-height: 38px; padding: 0 16px; border-radius: 10px; background: #0d9488; color: #fff; font-size: 14px; font-weight: 500; text-decoration: none; }
.search-bar { padding: 0 0 14px; }
.search-form { position: relative; max-width: 560px; }
.search-icon { position: absolute; left: 14px; top: 50%; transform: translateY(-50%); width: 16px; height: 16px; border: 2px solid #94a3b8; border-radius: 50%; }
.search-icon::after { content: ""; position: absolute; right: -5px; bottom: -5px; width: 6px; height: 2px; background: #94a3b8; border-radius: 999px; transform: rotate(45deg); }
.search-input { width: 100%; min-height: 46px; padding: 0 14px 0 42px; border: 1px solid rgba(226,232,240,1); border-radius: 10px; background: #f8fafc; color: #334155; font-size: 14px; font-family: inherit; outline: none; }
.search-input::placeholder { color: #94a3b8; }
</style></head>
<body>
  <header class="header">
    <div class="header-inner">
      <a class="brand" href="#">
        <span class="brand-icon">
          <svg viewBox="0 0 64 64" fill="none" stroke="#f8fafc" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
            <rect x="6" y="6" width="52" height="52" rx="16"></rect>
            <path d="M20 23h24M20 32h18M20 41h24"></path>
            <path d="M42 20l6 6-6 6"></path>
          </svg>
        </span>
        <span class="brand-copy">
          <span class="brand-name">SoloOpsGuide</span>
          <span class="brand-tagline">Workflow-first guidance for solo operators</span>
        </span>
      </a>
      <nav class="nav">
        <a href="#">Workflows</a>
        <a href="#">Blueprints</a>
        <a href="#">Comparisons</a>
        <a href="#">Templates</a>
        <a href="#">Glossary</a>
      </nav>
      <a class="btn-header" href="#">Explore workflows</a>
    </div>
    <div class="search-bar">
      <div class="search-form">
        <span class="search-icon"></span>
        <input class="search-input" type="search" placeholder="Search workflows, blueprints, comparisons, and assets...">
      </div>
    </div>
  </header>
</body></html>
