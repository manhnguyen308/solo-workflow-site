<!DOCTYPE html>
<html lang="en">
<head><meta charset="UTF-8"><style>
* { box-sizing: border-box; margin: 0; padding: 0; }
body { font-family: "Segoe UI","Avenir Next","Helvetica Neue",Arial,sans-serif; background: #fafbfc; padding: 20px; }
.row { display: flex; gap: 8px; flex-wrap: wrap; }
.swatch { display: flex; flex-direction: column; gap: 6px; min-width: 80px; }
.chip { height: 56px; border-radius: 12px; border: 1px solid rgba(0,0,0,0.06); }
.label { font-size: 11px; color: #475569; line-height: 1.3; }
.name { font-size: 12px; font-weight: 600; color: #0f172a; }
.section { margin-bottom: 20px; }
.section-title { font-size: 11px; font-weight: 700; letter-spacing: 0.12em; text-transform: uppercase; color: #94a3b8; margin-bottom: 12px; }
</style></head>
<body>
<div class="section">
  <div class="section-title">Teal — Brand Primary</div>
  <div class="row">
    <div class="swatch"><div class="chip" style="background:#0f8b8d;"></div><div class="name">Brand</div><div class="label">#0f8b8d</div></div>
    <div class="swatch"><div class="chip" style="background:#0b6d71;"></div><div class="name">Brand Strong</div><div class="label">#0b6d71</div></div>
    <div class="swatch"><div class="chip" style="background:#0d9488;"></div><div class="name">Brand Alt</div><div class="label">#0d9488</div></div>
    <div class="swatch"><div class="chip" style="background:#0f766e;"></div><div class="name">Brand Deep</div><div class="label">#0f766e</div></div>
    <div class="swatch"><div class="chip" style="background:#e7f6f6; border-color:rgba(15,139,141,0.15);"></div><div class="name">Brand Soft</div><div class="label">#e7f6f6</div></div>
    <div class="swatch"><div class="chip" style="background:#ccfbf1; border-color:rgba(15,139,141,0.15);"></div><div class="name">Brand Mint</div><div class="label">#ccfbf1</div></div>
  </div>
</div>
<div class="section">
  <div class="section-title">Amber — Accent</div>
  <div class="row">
    <div class="swatch"><div class="chip" style="background:#b8823f;"></div><div class="name">Accent</div><div class="label">#b8823f</div></div>
    <div class="swatch"><div class="chip" style="background:#926227;"></div><div class="name">Accent Strong</div><div class="label">#926227</div></div>
    <div class="swatch"><div class="chip" style="background:#d97706;"></div><div class="name">Accent Bright</div><div class="label">#d97706</div></div>
    <div class="swatch"><div class="chip" style="background:#fff3e3; border-color:rgba(184,130,63,0.15);"></div><div class="name">Accent Soft</div><div class="label">#fff3e3</div></div>
    <div class="swatch"><div class="chip" style="background:#fef3c7; border-color:rgba(217,119,6,0.15);"></div><div class="name">Accent Light</div><div class="label">#fef3c7</div></div>
  </div>
</div>
</body></html>
