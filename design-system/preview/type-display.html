<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Source+Sans+3:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
* { box-sizing: border-box; margin: 0; padding: 0; }
body { font-family: "Source Sans 3","Helvetica Neue",Arial,sans-serif; background: #fafbfc; padding: 20px 24px; }
.specimen { margin-bottom: 18px; padding-bottom: 18px; border-bottom: 1px solid #e2e8f0; }
.specimen:last-child { border-bottom: none; margin-bottom: 0; }
.meta { font-size: 11px; color: #94a3b8; margin-bottom: 4px; letter-spacing: 0.04em; font-family: "Source Sans 3","Helvetica Neue",Arial,sans-serif; }
.h1-sample { font-family: "Source Sans 3","Helvetica Neue",Arial,sans-serif; font-size: clamp(2.2rem,5vw,3.2rem); font-weight: 700; letter-spacing: -0.03em; line-height: 1.08; color: #0f172a; text-wrap: balance; }
.h2-sample { font-family: "Source Sans 3","Helvetica Neue",Arial,sans-serif; font-size: clamp(1.6rem,3vw,2.2rem); font-weight: 600; letter-spacing: -0.025em; line-height: 1.15; color: #0f172a; }
.h3-sample { font-family: "Source Sans 3","Helvetica Neue",Arial,sans-serif; font-size: clamp(1.1rem,2vw,1.4rem); font-weight: 600; letter-spacing: -0.02em; line-height: 1.28; color: #0f172a; }
</style>
</head>
<body>
  <div class="specimen">
    <div class="meta">H1 · Source Sans 3 · 700 · −0.03em · lh 1.08</div>
    <div class="h1-sample">Fix the client workflow before you optimize the stack</div>
  </div>
  <div class="specimen">
    <div class="meta">H2 · Source Sans 3 · 600 · −0.025em · lh 1.15</div>
    <div class="h2-sample">Guidance designed for action</div>
  </div>
  <div class="specimen">
    <div class="meta">H3 · Source Sans 3 · 600 · −0.02em · lh 1.28</div>
    <div class="h3-sample">Workflow-first</div>
  </div>
</body>
</html>
