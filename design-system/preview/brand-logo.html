<!DOCTYPE html>
<html lang="en">
<head><meta charset="UTF-8"><style>
* { box-sizing: border-box; margin: 0; padding: 0; }
body { font-family: "Segoe UI","Avenir Next","Helvetica Neue",Arial,sans-serif; background: #f1f5f9; padding: 24px; display: flex; flex-direction: column; gap: 16px; align-items: flex-start; }
.brand-row { display: flex; gap: 20px; align-items: center; flex-wrap: wrap; }
.brand-lg { display: inline-flex; align-items: center; gap: 14px; }
.brand-icon { display: inline-flex; align-items: center; justify-content: center; border-radius: 16px; background: linear-gradient(145deg, #0f8b8d, #0b6d71); box-shadow: inset 0 1px 0 rgba(255,255,255,0.3), 0 10px 24px rgba(15,23,42,0.10); flex-shrink: 0; }
.brand-icon svg { display: block; fill: none; stroke: #f8fafc; stroke-linecap: round; stroke-linejoin: round; }
.brand-copy { display: flex; flex-direction: column; }
.brand-name { color: #0f172a; font-weight: 600; line-height: 1.1; letter-spacing: -0.02em; }
.brand-tagline { color: #64748b; line-height: 1.35; margin-top: 2px; }
.divider { width: 1px; height: 60px; background: #e2e8f0; }
.og-card { border-radius: 14px; overflow: hidden; background: #0f172a; padding: 20px 22px; display: flex; flex-direction: column; gap: 8px; max-width: 360px; }
.og-title { font-size: 22px; font-weight: 700; color: #f8fafc; letter-spacing: -0.02em; line-height: 1.15; }
.og-desc { font-size: 13px; color: #94a3b8; line-height: 1.5; }
</style></head>
<body>
  <div class="brand-row">
    <!-- Large -->
    <div class="brand-lg">
      <span class="brand-icon" style="width:52px;height:52px;">
        <svg viewBox="0 0 64 64" width="32" height="32" stroke-width="2.5"><rect x="6" y="6" width="52" height="52" rx="16"></rect><path d="M20 23h24M20 32h18M20 41h24"></path><path d="M42 20l6 6-6 6"></path></svg>
      </span>
      <span class="brand-copy">
        <span class="brand-name" style="font-size:22px;">SoloOpsGuide</span>
        <span class="brand-tagline" style="font-size:13px;">Workflow-first guidance for solo operators</span>
      </span>
    </div>
    <div class="divider"></div>
    <!-- Medium -->
    <div class="brand-lg">
      <span class="brand-icon" style="width:40px;height:40px;">
        <svg viewBox="0 0 64 64" width="24" height="24" stroke-width="2.6"><rect x="6" y="6" width="52" height="52" rx="16"></rect><path d="M20 23h24M20 32h18M20 41h24"></path><path d="M42 20l6 6-6 6"></path></svg>
      </span>
      <span class="brand-copy">
        <span class="brand-name" style="font-size:18px;">SoloOpsGuide</span>
        <span class="brand-tagline" style="font-size:12px;">Workflow-first guidance for solo operators</span>
      </span>
    </div>
    <div class="divider"></div>
    <!-- Small -->
    <span class="brand-icon" style="width:32px;height:32px;border-radius:10px;">
      <svg viewBox="0 0 64 64" width="20" height="20" stroke-width="2.8"><rect x="6" y="6" width="52" height="52" rx="16"></rect><path d="M20 23h24M20 32h18M20 41h24"></path><path d="M42 20l6 6-6 6"></path></svg>
    </span>
  </div>
  <div class="og-card">
    <div class="og-title">SoloOpsGuide</div>
    <div class="og-desc">Workflow-first guidance for freelancers, consultants, and solo operators building calmer client operations.</div>
  </div>
</body></html>
