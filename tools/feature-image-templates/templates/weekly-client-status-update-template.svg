<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" role="img" aria-labelledby="title desc">
  <title id="title">Weekly client status update template illustration</title>
  <desc id="desc">An editorial template illustration showing a weekly status update document with progress, blockers, and next actions.</desc>
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f8fbfd" />
      <stop offset="100%" stop-color="#eef6fb" />
    </linearGradient>
  </defs>
  <rect width="1600" height="900" fill="url(#bg)" />
  <circle cx="1280" cy="180" r="150" fill="#e8f5f3" />
  <rect x="250" y="120" width="840" height="660" rx="34" fill="#ffffff" stroke="#d8e5ec" stroke-width="4" />
  <rect x="1110" y="206" width="240" height="388" rx="28" fill="#102430" />
  <rect x="320" y="178" width="182" height="34" rx="17" fill="#d8f3f1" />
  <text x="352" y="200" font-family="Segoe UI, Arial, sans-serif" font-size="16" font-weight="700" fill="#0f766e">template</text>
  <text x="320" y="276" font-family="Segoe UI, Arial, sans-serif" font-size="28" font-weight="700" fill="#122838">Weekly update</text>
  <rect x="320" y="296" width="236" height="20" rx="10" fill="#173042" opacity=".12" />
  <text x="320" y="360" font-family="Segoe UI, Arial, sans-serif" font-size="16" font-weight="700" fill="#334b5c">1. Progress this week</text>
  <rect x="320" y="380" width="332" height="14" rx="7" fill="#173042" opacity=".12" />
  <rect x="320" y="408" width="286" height="14" rx="7" fill="#173042" opacity=".08" />
  <text x="320" y="466" font-family="Segoe UI, Arial, sans-serif" font-size="16" font-weight="700" fill="#334b5c">2. Current status</text>
  <rect x="320" y="486" width="110" height="28" rx="14" fill="#ecfdf3" />
  <text x="351" y="505" font-family="Segoe UI, Arial, sans-serif" font-size="12" font-weight="700" fill="#15803d">on track</text>
  <text x="320" y="560" font-family="Segoe UI, Arial, sans-serif" font-size="16" font-weight="700" fill="#334b5c">3. Blockers / dependencies</text>
  <rect x="320" y="580" width="300" height="14" rx="7" fill="#173042" opacity=".08" />
  <text x="320" y="638" font-family="Segoe UI, Arial, sans-serif" font-size="16" font-weight="700" fill="#334b5c">4. Next action</text>
  <rect x="320" y="658" width="254" height="14" rx="7" fill="#173042" opacity=".08" />
  <text x="1150" y="252" font-family="Segoe UI, Arial, sans-serif" font-size="18" font-weight="700" fill="#d6faf5">Use with</text>
  <rect x="1150" y="280" width="120" height="30" rx="15" fill="#d6faf5" opacity=".12" />
  <rect x="1150" y="326" width="120" height="30" rx="15" fill="#d6faf5" opacity=".12" />
  <rect x="1150" y="372" width="120" height="30" rx="15" fill="#d6faf5" opacity=".12" />
  <text x="1179" y="300" font-family="Segoe UI, Arial, sans-serif" font-size="13" font-weight="700" fill="#d6faf5">status</text>
  <text x="1178" y="346" font-family="Segoe UI, Arial, sans-serif" font-size="13" font-weight="700" fill="#d6faf5">review</text>
  <text x="1169" y="392" font-family="Segoe UI, Arial, sans-serif" font-size="13" font-weight="700" fill="#d6faf5">next step</text>
</svg>
