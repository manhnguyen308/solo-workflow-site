<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" role="img" aria-labelledby="title desc">
  <title id="title">Client offboarding workflow illustration</title>
  <desc id="desc">An editorial workflow illustration showing closeout, signoff, invoice state, testimonial timing, and archive decisions at the end of an engagement.</desc>
  <defs>
    <linearGradient id="offboard-bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f4fbfb" />
      <stop offset="100%" stop-color="#eef4fb" />
    </linearGradient>
    <linearGradient id="offboard-panel" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0e8c99" />
      <stop offset="100%" stop-color="#194b78" />
    </linearGradient>
  </defs>
  <rect width="1600" height="900" fill="url(#offboard-bg)" />
  <circle cx="1288" cy="172" r="150" fill="#dcf2f2" />
  <circle cx="252" cy="730" r="146" fill="#e4eef9" />
  <rect x="96" y="96" width="1408" height="708" rx="44" fill="#ffffff" stroke="#d8e5ec" stroke-width="4" />
  <text x="156" y="190" font-family="Georgia, 'Times New Roman', serif" font-size="38" fill="#122838">Client offboarding workflow</text>
  <rect x="156" y="208" width="292" height="18" rx="9" fill="#173042" opacity=".12" />
  <rect x="156" y="258" width="1288" height="122" rx="34" fill="#f8fbfd" stroke="#d8e5ec" stroke-width="3" />
