  <circle cx="250" cy="322" r="18" fill="#f7a928" />
  <circle cx="478" cy="322" r="18" fill="#f7a928" />
  <circle cx="706" cy="322" r="18" fill="#f7a928" />
  <circle cx="934" cy="322" r="18" fill="#f7a928" />
  <circle cx="1162" cy="322" r="18" fill="#f7a928" />
  <circle cx="1360" cy="322" r="18" fill="#f7a928" />
