  <text x="1308" y="358" font-family="Arial, sans-serif" font-size="18" font-weight="700" fill="#46627e">Archive</text>
  <rect x="156" y="420" width="462" height="312" rx="34" fill="#f8fbfd" stroke="#d8e5ec" stroke-width="3" />
  <text x="204" y="478" font-family="Georgia, 'Times New Roman', serif" font-size="34" fill="#122838">Final closeout record</text>
  <rect x="204" y="496" width="172" height="18" rx="9" fill="#173042" opacity=".12" />
