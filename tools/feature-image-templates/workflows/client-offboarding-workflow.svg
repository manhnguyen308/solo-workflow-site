  <text x="432" y="358" font-family="Arial, sans-serif" font-size="18" font-weight="700" fill="#46627e">Signoff</text>
  <text x="665" y="358" font-family="Arial, sans-serif" font-size="18" font-weight="700" fill="#46627e">Invoice</text>
  <text x="894" y="358" font-family="Arial, sans-serif" font-size="18" font-weight="700" fill="#46627e">Record</text>
