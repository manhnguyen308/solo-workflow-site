<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" role="img" aria-labelledby="title desc">
  <title id="title">Billing status comparison illustration</title>
  <desc id="desc">An editorial comparison of invoice-tool visibility versus system-of-record billing visibility.</desc>
  <defs>
    <linearGradient id="billing-bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f8fafc" />
      <stop offset="100%" stop-color="#eef4fb" />
    </linearGradient>
    <linearGradient id="billing-panel" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f4c64" />
      <stop offset="100%" stop-color="#113a6b" />
    </linearGradient>
  </defs>
  <rect width="1600" height="900" fill="url(#billing-bg)" />
  <circle cx="1290" cy="176" r="152" fill="#dce9fb" />
  <circle cx="256" cy="724" r="144" fill="#dff4f2" />
  <rect x="96" y="96" width="1408" height="708" rx="44" fill="#ffffff" stroke="#d8e5ec" stroke-width="4" />
  <text x="156" y="190" font-family="Georgia, 'Times New Roman', serif" font-size="38" fill="#122838">Billing status visibility</text>
  <rect x="156" y="208" width="286" height="18" rx="9" fill="#173042" opacity=".12" />
  <rect x="156" y="258" width="594" height="474" rx="36" fill="url(#billing-panel)" />
  <rect x="850" y="258" width="594" height="474" rx="36" fill="#f8fbfd" stroke="#d8e5ec" stroke-width="3" />
  <text x="204" y="320" font-family="Georgia, 'Times New Roman', serif" font-size="34" fill="#eef6ff">Invoice tool only</text>
  <text x="898" y="320" font-family="Georgia, 'Times New Roman', serif" font-size="34" fill="#122838">System of record visible</text>
  <rect x="204" y="378" width="184" height="42" rx="21" fill="#ffd27a" />
  <text x="247" y="405" font-family="Arial, sans-serif" font-size="18" font-weight="700" fill="#5b4520">Invoice sent</text>
  <rect x="204" y="446" width="434" height="156" rx="28" fill="#ffffff" opacity=".98" />
  <text x="242" y="498" font-family="Arial, sans-serif" font-size="20" font-weight="700" fill="#45627a">Invoice #2047</text>
  <rect x="242" y="526" width="220" height="12" rx="6" fill="#d6dfea" />
  <rect x="242" y="552" width="188" height="12" rx="6" fill="#d6dfea" />
  <rect x="242" y="578" width="116" height="12" rx="6" fill="#d6dfea" />
  <rect x="204" y="628" width="184" height="42" rx="21" fill="#dce7f5" />
  <text x="236" y="655" font-family="Arial, sans-serif" font-size="18" font-weight="700" fill="#45627a">Payment due</text>
  <text x="422" y="655" font-family="Arial, sans-serif" font-size="18" fill="#dce7f5">Checked only in billing app</text>
  <rect x="898" y="378" width="176" height="42" rx="21" fill="#ffd27a" />
  <rect x="1094" y="378" width="214" height="42" rx="21" fill="#c9d9f3" />
  <text x="942" y="405" font-family="Arial, sans-serif" font-size="18" font-weight="700" fill="#5b4520">Invoice sent</text>
  <text x="1145" y="405" font-family="Arial, sans-serif" font-size="18" font-weight="700" fill="#35536e">Ops state visible</text>
  <rect x="898" y="446" width="176" height="184" rx="28" fill="#ffffff" stroke="#d8e5ec" stroke-width="3" />
  <rect x="1100" y="446" width="248" height="184" rx="28" fill="#ffffff" stroke="#d8e5ec" stroke-width="3" />
  <text x="940" y="498" font-family="Arial, sans-serif" font-size="20" font-weight="700" fill="#45627a">Invoice tool</text>
  <rect x="940" y="526" width="112" height="12" rx="6" fill="#d6dfea" />
  <rect x="940" y="552" width="94" height="12" rx="6" fill="#d6dfea" />
  <rect x="940" y="578" width="76" height="12" rx="6" fill="#d6dfea" />
  <text x="1140" y="498" font-family="Arial, sans-serif" font-size="20" font-weight="700" fill="#45627a">Main record</text>
  <rect x="1140" y="526" width="138" height="34" rx="17" fill="#dde7f5" />
  <rect x="1140" y="574" width="164" height="34" rx="17" fill="#d7f0e2" />
  <text x="1172" y="548" font-family="Arial, sans-serif" font-size="18" font-weight="700" fill="#45627a">Due soon</text>
  <text x="1168" y="596" font-family="Arial, sans-serif" font-size="18" font-weight="700" fill="#2f6b54">Next follow-up</text>
  <rect x="898" y="648" width="450" height="58" rx="24" fill="#eaf1fb" />
  <text x="936" y="675" font-family="Arial, sans-serif" font-size="16" font-weight="700" fill="#4b6480">
    <tspan x="936" dy="0">Finance keeps the detail while ops</tspan>
    <tspan x="936" dy="20">keeps the live billing state visible</tspan>
  </text>
</svg>
