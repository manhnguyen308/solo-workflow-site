<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" role="img" aria-labelledby="title desc">
  <title id="title">CRM versus project management comparison</title>
  <desc id="desc">A balanced comparison board with two clear columns, readable labels, and simple separation between CRM-first and project-management-first operating models.</desc>
  <defs>
    <linearGradient id="compare-bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#faf7f0" />
      <stop offset="100%" stop-color="#eef4fb" />
    </linearGradient>
  </defs>
  <rect width="1600" height="900" fill="url(#compare-bg)" />
  <circle cx="1288" cy="168" r="148" fill="#dfe9fb" opacity=".62" />
  <circle cx="270" cy="738" r="142" fill="#d8f3f1" opacity=".82" />

  <rect x="108" y="92" width="1384" height="716" rx="46" fill="#ffffff" stroke="#d9e5ec" stroke-width="4" />
  <text x="170" y="182" font-family="Georgia, 'Times New Roman', serif" font-size="44" fill="#122838">CRM vs PM</text>
  <rect x="170" y="198" width="190" height="18" rx="9" fill="#122838" opacity=".10" />

  <rect x="170" y="252" width="1260" height="468" rx="42" fill="#f9fbfd" stroke="#d9e5ec" stroke-width="3" />
  <line x1="800" y1="314" x2="800" y2="658" stroke="#d9e4ea" stroke-width="4" />

  <rect x="230" y="314" width="510" height="344" rx="40" fill="#17355f" />
  <rect x="860" y="314" width="510" height="344" rx="40" fill="#ffffff" stroke="#d9e5ec" stroke-width="3" />

  <rect x="272" y="348" width="176" height="52" rx="26" fill="#d8f3f1" />
  <rect x="902" y="348" width="160" height="52" rx="26" fill="#dfe9fb" />
  <text x="308" y="382" font-family="Arial, sans-serif" font-size="24" font-weight="700" fill="#0f8b8d">CRM-first</text>
  <text x="942" y="382" font-family="Arial, sans-serif" font-size="24" font-weight="700" fill="#36589a">PM-first</text>

  <rect x="294" y="452" width="382" height="84" rx="30" fill="#ffffff" opacity=".12" />
  <rect x="294" y="556" width="382" height="84" rx="30" fill="#fff1db" />
  <rect x="924" y="452" width="382" height="84" rx="30" fill="#fff1db" />
  <rect x="924" y="556" width="382" height="84" rx="30" fill="#dff7e8" />

  <text x="342" y="505" font-family="Arial, sans-serif" font-size="32" font-weight="700" fill="#eef6ff">Lead record</text>
  <text x="342" y="609" font-family="Arial, sans-serif" font-size="32" font-weight="700" fill="#8a5d27">Follow-up</text>
  <text x="972" y="505" font-family="Arial, sans-serif" font-size="32" font-weight="700" fill="#8a5d27">Project record</text>
  <text x="972" y="609" font-family="Arial, sans-serif" font-size="32" font-weight="700" fill="#18794e">Delivery</text>
</svg>
