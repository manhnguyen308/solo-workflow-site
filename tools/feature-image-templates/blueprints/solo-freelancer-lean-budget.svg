<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" role="img" aria-labelledby="title desc">
  <title id="title">Software stack blueprint for a solo freelancer on a lean budget</title>
  <desc id="desc">A calm stacked-card blueprint showing a simple core stack with a clear supporting column for client hub, billing, and add-ons later.</desc>
  <defs>
    <linearGradient id="blueprint-bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f6fafc" />
      <stop offset="100%" stop-color="#eef4fb" />
    </linearGradient>
  </defs>
  <rect width="1600" height="900" fill="url(#blueprint-bg)" />
  <circle cx="1288" cy="166" r="148" fill="#dfe9fb" opacity=".66" />
  <circle cx="278" cy="740" r="140" fill="#d8f3f1" opacity=".82" />

  <rect x="108" y="92" width="1384" height="716" rx="46" fill="#ffffff" stroke="#d9e5ec" stroke-width="4" />
  <text x="170" y="170" font-family="Georgia, 'Times New Roman', serif" font-size="40" fill="#122838">Software stack</text>
  <text x="170" y="214" font-family="Georgia, 'Times New Roman', serif" font-size="40" fill="#122838">blueprint</text>
  <rect x="170" y="228" width="232" height="16" rx="8" fill="#122838" opacity=".10" />

  <rect x="170" y="252" width="1260" height="468" rx="42" fill="#f9fbfd" stroke="#d9e5ec" stroke-width="3" />

  <rect x="230" y="314" width="600" height="344" rx="40" fill="#17355f" />
  <text x="294" y="402" font-family="Arial, sans-serif" font-size="38" font-weight="700" fill="#eef6ff">Core stack</text>
  <rect x="294" y="434" width="214" height="18" rx="9" fill="#eef6ff" opacity=".42" />

  <rect x="294" y="500" width="210" height="88" rx="30" fill="#d8f3f1" />
  <rect x="530" y="500" width="236" height="88" rx="30" fill="#dfe9fb" />
  <text x="346" y="554" font-family="Arial, sans-serif" font-size="32" font-weight="700" fill="#0f766e">Client hub</text>
  <text x="584" y="554" font-family="Arial, sans-serif" font-size="32" font-weight="700" fill="#36589a">Billing</text>

  <rect x="880" y="314" width="490" height="148" rx="34" fill="#ffffff" stroke="#d9e5ec" stroke-width="3" />
  <rect x="880" y="492" width="490" height="166" rx="34" fill="#fff1db" />

  <text x="944" y="404" font-family="Arial, sans-serif" font-size="34" font-weight="700" fill="#36589a">Automation</text>
  <rect x="944" y="420" width="154" height="14" rx="7" fill="#36589a" opacity=".18" />

  <text x="944" y="586" font-family="Arial, sans-serif" font-size="34" font-weight="700" fill="#8a5d27">Add-ons later</text>
  <rect x="944" y="602" width="184" height="14" rx="7" fill="#8a5d27" opacity=".18" />
</svg>
