<header class="site-header">
  <div class="wrap">
    <a class="brand" href="{{ "/" | relURL }}">{{ .Site.Title }}</a>
    <nav aria-label="Primary">
      <ul class="menu">
        {{ range .Site.Menus.main }}
        <li><a href="{{ .URL }}">{{ .Name }}</a></li>
        {{ end }}
      </ul>
    </nav>
  </div>
</header>
