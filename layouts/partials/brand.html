{{ $class := .class | default "" }}
{{ $title := .title | default site.Title }}
{{ $tagline := .tagline | default site.Params.siteDescription }}
<span class="brand-system {{ $class }}">
  <span class="brand-mark" aria-hidden="true">
    <svg viewBox="0 0 64 64" role="img" focusable="false">
      <path class="bm-stroke" d="M 4 60 C 4 50 22 56 22 42 C 22 34 41 40 41 26 C 41 18 58 24 58 10 L 60 4"></path>
      <path class="bm-stroke" d="M 60 4 L 54 3.5 M 60 4 L 60.5 10"></path>
      <rect class="bm-ink" x="6" y="44" width="20" height="16" rx="2.5"></rect>
      <rect class="bm-teal" x="23" y="30" width="20" height="16" rx="2.5"></rect>
      <rect class="bm-teal" x="40" y="16" width="20" height="16" rx="2.5"></rect>
      <circle class="bm-disc" cx="16" cy="52" r="4.6"></circle>
      <text class="bm-num" x="16" y="54.6" text-anchor="middle">1</text>
      <circle class="bm-disc" cx="33" cy="38" r="4.6"></circle>
      <text class="bm-num" x="33" y="40.6" text-anchor="middle">2</text>
      <circle class="bm-disc" cx="50" cy="24" r="4.6"></circle>
      <text class="bm-num" x="50" y="26.6" text-anchor="middle">3</text>
    </svg>
  </span>
  <span class="brand-wordmark">
    <span class="brand-name">{{ $title }}</span>
    <span class="brand-tagline">{{ $tagline }}</span>
  </span>
</span>
