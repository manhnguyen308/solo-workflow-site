<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
{{ $title := cond .IsHome .Site.Title (printf "%s | %s" .Title .Site.Title) }}
<title>{{ $title }}</title>
{{ $desc := .Description | default .Summary | default .Site.Params.siteDescription }}
<meta name="description" content="{{ $desc }}">
<link rel="canonical" href="{{ .Permalink }}">
<meta name="robots" content="index,follow">
<meta property="og:type" content="{{ if .IsPage }}article{{ else }}website{{ end }}">
<meta property="og:title" content="{{ $title }}">
<meta property="og:description" content="{{ $desc }}">
<meta property="og:url" content="{{ .Permalink }}">
<meta property="og:image" content="{{ .Site.Params.defaultImage | absURL }}">
<meta name="twitter:card" content="summary_large_image">
<meta name="twitter:title" content="{{ $title }}">
<meta name="twitter:description" content="{{ $desc }}">
<link rel="stylesheet" href="{{ "css/main.css" | relURL }}">
{{ if .IsPage }}
<script type="application/ld+json">{"@context":"https://schema.org","@type":"Article","headline":{{ .Title | jsonify }},"description":{{ $desc | jsonify }},"datePublished":"{{ .Date.Format "2006-01-02" }}","author":{"@type":"Person","name":{{ .Site.Params.author | jsonify }}}}</script>
{{ end }}
