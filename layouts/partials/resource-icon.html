{{ $kind := . }}
<span class="homepage-resource-icon homepage-resource-icon-{{ $kind }}" aria-hidden="true">
  {{ if eq $kind "workflows" }}
  <svg viewBox="0 0 32 32" focusable="false">
    <circle cx="7" cy="16" r="2.5"></circle>
    <circle cx="16" cy="10" r="2.5"></circle>
    <circle cx="25" cy="22" r="2.5"></circle>
    <path d="M9.5 15l4-3.5M18.5 11.5l4.5 8"></path>
  </svg>
  {{ else if eq $kind "blueprints" }}
  <svg viewBox="0 0 32 32" focusable="false">
    <rect x="5" y="6" width="9" height="8" rx="2"></rect>
    <rect x="18" y="6" width="9" height="8" rx="2"></rect>
    <rect x="11.5" y="18" width="9" height="8" rx="2"></rect>
    <path d="M14 10h4M9.5 14v4M22.5 14v4M14 22h4"></path>
  </svg>
  {{ else if eq $kind "comparisons" }}
  <svg viewBox="0 0 32 32" focusable="false">
    <rect x="5" y="7" width="9" height="18" rx="2"></rect>
    <rect x="18" y="7" width="9" height="18" rx="2"></rect>
    <path d="M16 6v20"></path>
  </svg>
  {{ else if eq $kind "templates" }}
  <svg viewBox="0 0 32 32" focusable="false">
    <path d="M10 5h9l5 5v15a2 2 0 0 1-2 2H10a2 2 0 0 1-2-2V7a2 2 0 0 1 2-2Z"></path>
    <path d="M19 5v5h5M12 15h8M12 19h8M12 23h6"></path>
  </svg>
  {{ else if eq $kind "glossary" }}
  <svg viewBox="0 0 32 32" focusable="false">
    <rect x="6" y="7" width="20" height="18" rx="3"></rect>
    <path d="M11 13h10M11 18h7"></path>
    <circle cx="22.5" cy="11.5" r="2"></circle>
  </svg>
  {{ end }}
</span>
