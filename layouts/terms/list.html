{{ define "main" }}
<div class="wrap">
  <h1>{{ .Title }}</h1>
  {{ with .Content }}<div>{{ . }}</div>{{ end }}
  {{ if gt (len .Pages) 0 }}
  <ul>
    {{ range .Pages.ByDate.Reverse }}
    <li>
      <a href="{{ .RelPermalink }}">{{ .Title }}</a>
      {{ with .Params.summary }}<p>{{ . }}</p>{{ end }}
    </li>
    {{ end }}
  </ul>
  {{ end }}
</div>
{{ end }}
