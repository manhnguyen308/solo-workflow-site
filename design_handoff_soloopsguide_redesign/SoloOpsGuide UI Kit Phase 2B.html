<!doctype html>
<!-- @dsCard group="Brand" name="SoloOpsGuide UI Kit · Phase 2B" -->
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>SoloOpsGuide — UI Kit · Phase 2B</title>
  <link rel="stylesheet" href="styles.css" />
  <style>
    html, body { margin: 0; padding: 0; background: #1c1a17; }
    body { font-family: "Public Sans", system-ui, sans-serif; color: #f4efe3; }
    .kit-doc-card {
      background: #FAF8F2;
      color: #2A2620;
      padding: 56px 64px;
      font-family: "Public Sans", system-ui, sans-serif;
      font-size: 16px;
      line-height: 1.6;
    }
    .kit-doc-card h1 { font: 500 36px/1.15 "Source Serif 4", serif; letter-spacing: -0.012em; margin: 0 0 8px; }
    .kit-doc-card .eyebrow { font: 600 12px/1.4 "Public Sans"; letter-spacing: 0.08em; text-transform: uppercase; color: #6B645A; margin-bottom: 16px; }
    .kit-doc-card .lede { font: 400 19px/1.5 "Source Serif 4", serif; color: #6B645A; max-width: 640px; }
    .kit-doc-card h3 { font: 600 14px/1.4 "Public Sans"; letter-spacing: 0.06em; text-transform: uppercase; color: #2A2620; margin: 32px 0 12px; }
    .kit-doc-card .grid { display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 24px; margin-top: 16px; border-top: 1px solid #D7D1C4; padding-top: 16px; }
    .kit-doc-card .grid > div { font-size: 14px; color: #2A2620; }
    .kit-doc-card .grid > div strong { display: block; margin-bottom: 6px; font: 600 12px/1.4 "Public Sans"; letter-spacing: 0.06em; text-transform: uppercase; color: #6B645A; }
    .kit-doc-card ul { padding-left: 18px; margin: 8px 0 0; }
    .kit-doc-card li { margin-bottom: 6px; }
    .kit-doc-card a { color: #2F4E78; }
  </style>

  <script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
  <script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
  <script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>
</head>
<body>
  <div id="root"></div>

  <script type="text/babel" src="design-canvas.jsx"></script>
  <script type="text/babel" src="components.jsx"></script>
  <script type="text/babel" src="screens/glossary-index.jsx"></script>
  <script type="text/babel" src="screens/glossary-index-mobile.jsx"></script>
  <script type="text/babel" src="screens/glossary-entry.jsx"></script>
  <script type="text/babel" src="screens/glossary-entry-mobile.jsx"></script>
  <script type="text/babel" src="screens/faq-index.jsx"></script>
  <script type="text/babel" src="screens/faq-index-mobile.jsx"></script>
  <script type="text/babel" src="screens/faq-entry.jsx"></script>
  <script type="text/babel" src="screens/faq-entry-mobile.jsx"></script>

  <script type="text/babel">
    const Intro = () => (
      <div className="kit-doc-card" style={{ width: 1200 }}>
        <div className="eyebrow">SoloOpsGuide · UI Kit · Phase 2B · 2026-05-18</div>
        <h1>Reference surfaces, not archive pages.</h1>
        <p className="lede">
          Glossary and FAQ as proper reference layers, scaling from ~50 toward 200+ entries without becoming keyword-dumps. Built on the Phase 1 system (Source Serif 4 + Public Sans, warm-paper palette, single deep-blue accent). Earlier kits: <a href="SoloOpsGuide UI Kit Phase 1.html">Phase 1</a> · <a href="SoloOpsGuide UI Kit Phase 2A.html">Phase 2A</a>.
        </p>

        <h3>What's in Phase 2B</h3>
        <ol>
          <li><strong style={{ display: "inline", fontWeight: 600 }}>Glossary index (desktop + mobile)</strong> — A–Z with grouped letter sections, jump rail, topic filter, lightweight search, manually-curated cross-links. Designed to read as a reference, not a tag cloud.</li>
          <li><strong style={{ display: "inline", fontWeight: 600 }}>Glossary entry (desktop + mobile)</strong> — short definition block, plain-English explanation, "why it matters for solo operators", a workflow example, related terms, related content, editorial meta. Manual internal linking.</li>
          <li><strong style={{ display: "inline", fontWeight: 600 }}>FAQ index (desktop + mobile)</strong> — clustered by practical topic (Kickoff, Approvals, Scope, Payment, Stacks, Templates), each row shows question, short answer, topic, link, last-reviewed date.</li>
          <li><strong style={{ display: "inline", fontWeight: 600 }}>FAQ entry (desktop + mobile)</strong> — direct answer up top, deeper explanation, practical example, related cross-links, schema-ready editorial note. No fake expert claims.</li>
        </ol>

        <h3>What's new in the component set</h3>
        <div className="grid">
          <div>
            <strong>Glossary primitives</strong>
            alphaRail (A–Z jump rail with empty-state) · glossaryLetter heading · termRow · definitionBlock · relatedTerms list
          </div>
          <div>
            <strong>FAQ primitives</strong>
            topic-group head · faqRow (topic · Q · A preview · open) · faqAnswer (direct-answer block) · filterInput (lightweight search)
          </div>
          <div>
            <strong>Reused from Phase 1 / 2A</strong>
            siteHeader · breadcrumbs · chip · callout · templateBlock · prose · editorial-meta footer · sticky utility rail pattern
          </div>
        </div>

        <h3>Open questions for Phase 2C</h3>
        <ul>
          <li>About / Editorial-policy / Content-policy pages (the trust layer).</li>
          <li>Search results page — site-wide search across glossary, FAQ, workflows, blueprints.</li>
          <li>Reading-path index (a hub page for all paths, vs. the path-detail page already in Phase 1).</li>
          <li>404 / empty states / printable variants.</li>
          <li>Editorial-revision diff page (showing what changed in a quarterly review).</li>
        </ul>
      </div>
    );

    function Kit() {
      return (
        <DesignCanvas title="SoloOpsGuide — Phase 2B" subtitle="Glossary · FAQ">
          <DCSection id="intro" title="Phase 2B · Direction">
            <DCArtboard id="intro-card" label="Phase 2B overview" width={1200} height={620}>
              <Intro />
            </DCArtboard>
          </DCSection>

          <DCSection id="glossary-index" title="08 · Glossary Index">
            <DCArtboard id="gi-desktop" label="Glossary index · desktop · 1280" width={1280} height={5260}>
              <GlossaryIndexDesktop />
            </DCArtboard>
            <DCArtboard id="gi-mobile" label="Glossary index · mobile · 390" width={390} height={5400}>
              <GlossaryIndexMobile />
            </DCArtboard>
          </DCSection>

          <DCSection id="glossary-entry" title="09 · Glossary Entry — Source of truth">
            <DCArtboard id="ge-desktop" label="Glossary entry · desktop · 1280" width={1280} height={2580}>
              <GlossaryEntryDesktop />
            </DCArtboard>
            <DCArtboard id="ge-mobile" label="Glossary entry · mobile · 390" width={390} height={2820}>
              <GlossaryEntryMobile />
            </DCArtboard>
          </DCSection>

          <DCSection id="faq-index" title="10 · FAQ Index">
            <DCArtboard id="fi-desktop" label="FAQ index · desktop · 1280" width={1280} height={3640}>
              <FAQIndexDesktop />
            </DCArtboard>
            <DCArtboard id="fi-mobile" label="FAQ index · mobile · 390" width={390} height={4200}>
              <FAQIndexMobile />
            </DCArtboard>
          </DCSection>

          <DCSection id="faq-entry" title="11 · FAQ Entry — Approval window length">
            <DCArtboard id="fe-desktop" label="FAQ entry · desktop · 1280" width={1280} height={2520}>
              <FAQEntryDesktop />
            </DCArtboard>
            <DCArtboard id="fe-mobile" label="FAQ entry · mobile · 390" width={390} height={2680}>
              <FAQEntryMobile />
            </DCArtboard>
          </DCSection>
        </DesignCanvas>
      );
    }

    ReactDOM.createRoot(document.getElementById("root")).render(<Kit />);
  </script>
</body>
</html>
