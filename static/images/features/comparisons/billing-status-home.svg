  <path d="M300 408H434" stroke="#87A0C7" stroke-width="4" stroke-linecap="round"/>
  <rect x="386" y="194" width="102" height="38" rx="12" fill="#C9D9F3"/>
  <text x="411" y="219" fill="#35536E" font-family="Arial, sans-serif" font-size="18">finance</text>

  <rect x="710" y="194" width="142" height="38" rx="12" fill="#FFD27A"/>
  <text x="735" y="219" fill="#5B4520" font-family="Arial, sans-serif" font-size="18">invoice sent</text>
  <rect x="870" y="194" width="174" height="38" rx="12" fill="#C9D9F3"/>
  <text x="893" y="219" fill="#35536E" font-family="Arial, sans-serif" font-size="18">ops status visible</text>
  <rect x="710" y="250" width="166" height="160" rx="18" fill="#FFFFFF"/>
  <text x="738" y="286" fill="#45627A" font-family="Arial, sans-serif" font-size="18">invoice tool</text>
  <rect x="736" y="304" width="108" height="10" rx="5" fill="#D6DFEA"/>
  <rect x="736" y="326" width="92" height="10" rx="5" fill="#D6DFEA"/>
  <rect x="736" y="350" width="72" height="10" rx="5" fill="#D6DFEA"/>
  <rect x="910" y="250" width="166" height="160" rx="18" fill="#FFFFFF"/>
