<svg width="1200" height="630" viewBox="0 0 1200 630" fill="none" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="title desc">
  <title id="title">Billing status comparison illustration</title>
  <desc id="desc">An editorial comparison of invoice-tool visibility versus system-of-record billing visibility.</desc>
  <defs>
    <linearGradient id="bg" x1="82" y1="52" x2="1088" y2="588" gradientUnits="userSpaceOnUse">
      <stop stop-color="#0E4C64"/>
      <stop offset="1" stop-color="#113A6B"/>
    </linearGradient>
    <linearGradient id="panel" x1="0" y1="0" x2="0" y2="1">
      <stop stop-color="#F8FBFF"/>
      <stop offset="1" stop-color="#EEF4FB"/>
    </linearGradient>
  </defs>
  <rect width="1200" height="630" rx="32" fill="url(#bg)"/>
  <path d="M70 40H1130" stroke="#9AC6D7" stroke-opacity=".18" stroke-width="2"/>
  <path d="M110 88H1090" stroke="#9AC6D7" stroke-opacity=".14" stroke-width="2"/>
  <circle cx="208" cy="150" r="118" fill="#B8D5D8" fill-opacity=".18"/>
  <circle cx="975" cy="462" r="126" fill="#B7C7E6" fill-opacity=".16"/>
