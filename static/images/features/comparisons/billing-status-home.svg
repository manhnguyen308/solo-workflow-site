  <text x="710" y="162" fill="#113A6B" font-family="Georgia, 'Times New Roman', serif" font-size="28">System of record visible</text>

  <rect x="124" y="194" width="146" height="38" rx="12" fill="#FFD27A"/>
  <text x="147" y="219" fill="#5B4520" font-family="Arial, sans-serif" font-size="18">invoice sent</text>
  <rect x="124" y="250" width="364" height="112" rx="18" fill="#FFFFFF"/>
  <text x="150" y="286" fill="#45627A" font-family="Arial, sans-serif" font-size="18">Invoice #2047</text>
  <rect x="150" y="304" width="220" height="10" rx="5" fill="#D6DFEA"/>
  <rect x="150" y="326" width="186" height="10" rx="5" fill="#D6DFEA"/>
  <rect x="150" y="348" width="98" height="10" rx="5" fill="#D6DFEA"/>
  <rect x="124" y="388" width="160" height="34" rx="12" fill="#DDE7F5"/>
