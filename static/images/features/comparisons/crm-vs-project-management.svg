  <text x="188" y="208" font-family="Segoe UI, Arial, sans-serif" font-size="30" font-weight="700" fill="#122838">CRM vs PM</text><rect x="188" y="226" width="150" height="20" rx="10" fill="#173042" opacity=".12"/>
  <rect x="188" y="302" width="518" height="360" rx="34" fill="#17355f"/><rect x="768" y="302" width="518" height="360" rx="34" fill="#f8fbfd" stroke="#d8e5ec" stroke-width="3"/><rect x="1320" y="302" width="104" height="360" rx="30" fill="#eef4fb"/>
