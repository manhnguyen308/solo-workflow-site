<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" role="img" aria-labelledby="title desc">
  <title id="title">CRM versus project management illustration</title>
  <desc id="desc">An editorial comparison illustration contrasting CRM-first and PM-first operating models with clear strengths, risks, and fit signals.</desc>
  <defs>
    <linearGradient id="compare-bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fbf7f0" />
      <stop offset="100%" stop-color="#f1f6fb" />
    </linearGradient>
    <linearGradient id="crm-panel" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#17355f" />
      <stop offset="100%" stop-color="#214b7d" />
    </linearGradient>
  </defs>
  <rect width="1600" height="900" fill="url(#compare-bg)" />
  <circle cx="1282" cy="172" r="152" fill="#f5ead8" />
  <circle cx="256" cy="730" r="146" fill="#e4eef9" />
  <rect x="96" y="96" width="1408" height="708" rx="44" fill="#ffffff" stroke="#d8e5ec" stroke-width="4" />
  <text x="156" y="190" font-family="Georgia, 'Times New Roman', serif" font-size="38" fill="#122838">CRM vs PM</text>
  <rect x="156" y="208" width="170" height="18" rx="9" fill="#173042" opacity=".12" />
  <rect x="156" y="258" width="594" height="474" rx="36" fill="url(#crm-panel)" />
  <rect x="850" y="258" width="594" height="474" rx="36" fill="#f8fbfd" stroke="#d8e5ec" stroke-width="3" />
  <text x="204" y="320" font-family="Georgia, 'Times New Roman', serif" font-size="34" fill="#eef6ff">CRM-first</text>
  <text x="898" y="320" font-family="Georgia, 'Times New Roman', serif" font-size="34" fill="#122838">PM-first</text>
  <rect x="204" y="374" width="174" height="42" rx="21" fill="#d8f3f1" />
  <rect x="204" y="434" width="174" height="42" rx="21" fill="#d6faf5" opacity=".16" />
  <rect x="204" y="494" width="174" height="42" rx="21" fill="#fff0db" opacity=".18" />
  <text x="252" y="401" font-family="Arial, sans-serif" font-size="18" font-weight="700" fill="#0f766e">Pipeline</text>
  <text x="247" y="461" font-family="Arial, sans-serif" font-size="18" font-weight="700" fill="#d6faf5">Follow-up</text>
  <text x="254" y="521" font-family="Arial, sans-serif" font-size="18" font-weight="700" fill="#f6d8b1">Billing handoff</text>
  <rect x="430" y="382" width="236" height="140" rx="26" fill="#ffffff" opacity=".12" />
  <rect x="462" y="422" width="144" height="12" rx="6" fill="#d6faf5" opacity=".8" />
  <rect x="462" y="448" width="164" height="12" rx="6" fill="#d6faf5" opacity=".48" />
  <rect x="462" y="474" width="126" height="12" rx="6" fill="#d6faf5" opacity=".28" />
  <rect x="430" y="560" width="236" height="92" rx="24" fill="#fff0db" opacity=".96" />
  <text x="466" y="598" font-family="Arial, sans-serif" font-size="16" font-weight="700" fill="#8a5d27">
    <tspan x="466" dy="0">Lead visibility stays</tspan>
    <tspan x="466" dy="22">at the center</tspan>
  </text>
  <rect x="898" y="374" width="174" height="42" rx="21" fill="#dfe9fb" />
  <rect x="898" y="434" width="174" height="42" rx="21" fill="#fff0db" />
  <rect x="898" y="494" width="174" height="42" rx="21" fill="#dff7e8" />
  <text x="940" y="401" font-family="Arial, sans-serif" font-size="18" font-weight="700" fill="#36589a">Milestones</text>
  <text x="949" y="461" font-family="Arial, sans-serif" font-size="18" font-weight="700" fill="#8a5d27">Owners</text>
  <text x="948" y="521" font-family="Arial, sans-serif" font-size="18" font-weight="700" fill="#18794e">Delivery state</text>
  <rect x="1124" y="382" width="262" height="64" rx="24" fill="#fee2e2" />
  <rect x="1124" y="466" width="262" height="64" rx="24" fill="#dff7e8" />
  <text x="1208" y="421" font-family="Arial, sans-serif" font-size="18" font-weight="700" fill="#b91c1c">Risk</text>
  <text x="1217" y="505" font-family="Arial, sans-serif" font-size="18" font-weight="700" fill="#18794e">Fit</text>
  <rect x="1124" y="560" width="262" height="92" rx="24" fill="#ffffff" stroke="#d8e5ec" stroke-width="3" />
  <text x="1160" y="598" font-family="Arial, sans-serif" font-size="16" font-weight="700" fill="#334b5c">
    <tspan x="1160" dy="0">Delivery truth stays</tspan>
    <tspan x="1160" dy="22">at the center</tspan>
  </text>
</svg>
