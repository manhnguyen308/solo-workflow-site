<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" role="img" aria-labelledby="title desc">
  <title id="title">CRM versus project management illustration</title>
  <desc id="desc">An editorial comparison illustration contrasting CRM-first and PM-first operating models with clear strengths, risks, and fit signals.</desc>
  <defs>
    <linearGradient id="compare-bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fbf7f0" />
      <stop offset="100%" stop-color="#f1f6fb" />
    </linearGradient>
    <linearGradient id="crm-panel" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#17355f" />
      <stop offset="100%" stop-color="#214b7d" />
    </linearGradient>
  </defs>
  <rect width="1600" height="900" fill="url(#compare-bg)" />
  <circle cx="1282" cy="170" r="150" fill="#f5ead8" />
  <circle cx="258" cy="736" r="144" fill="#e4eef9" />

  <rect x="104" y="92" width="1392" height="716" rx="46" fill="#ffffff" stroke="#d8e5ec" stroke-width="4" />
  <text x="164" y="184" font-family="Georgia, 'Times New Roman', serif" font-size="41" fill="#122838">CRM vs PM</text>
  <rect x="164" y="200" width="176" height="18" rx="9" fill="#173042" opacity=".12" />

  <rect x="164" y="250" width="598" height="474" rx="38" fill="url(#crm-panel)" />
  <rect x="838" y="250" width="598" height="474" rx="38" fill="#f8fbfd" stroke="#d8e5ec" stroke-width="3" />

  <text x="212" y="314" font-family="Georgia, 'Times New Roman', serif" font-size="37" fill="#eef6ff">CRM-first</text>
  <text x="886" y="314" font-family="Georgia, 'Times New Roman', serif" font-size="37" fill="#122838">PM-first</text>

  <rect x="212" y="366" width="192" height="50" rx="25" fill="#d8f3f1" />
  <rect x="212" y="432" width="192" height="50" rx="25" fill="#d9f8f3" opacity=".28" />
  <rect x="212" y="498" width="192" height="50" rx="25" fill="#fff0db" opacity=".22" />
  <text x="284" y="398" font-family="Arial, sans-serif" font-size="21" font-weight="700" fill="#0f766e">Pipeline</text>
  <text x="278" y="464" font-family="Arial, sans-serif" font-size="21" font-weight="700" fill="#eef6ff">Follow-up</text>
  <text x="296" y="530" font-family="Arial, sans-serif" font-size="21" font-weight="700" fill="#f6d8b1">Billing</text>

  <rect x="454" y="360" width="238" height="162" rx="30" fill="#ffffff" opacity=".12" />
  <rect x="486" y="400" width="138" height="14" rx="7" fill="#d6faf5" opacity=".8" />
  <rect x="486" y="430" width="162" height="14" rx="7" fill="#d6faf5" opacity=".52" />
  <rect x="486" y="460" width="126" height="14" rx="7" fill="#d6faf5" opacity=".3" />
  <rect x="454" y="566" width="238" height="92" rx="26" fill="#fff1db" />
  <text x="488" y="603" font-family="Arial, sans-serif" font-size="18" font-weight="700" fill="#8a5d27">
    <tspan x="488" dy="0">Lead visibility stays</tspan>
    <tspan x="488" dy="24">at the center</tspan>
  </text>

  <rect x="886" y="366" width="192" height="50" rx="25" fill="#dfe9fb" />
  <rect x="886" y="432" width="192" height="50" rx="25" fill="#fff0db" />
  <rect x="886" y="498" width="192" height="50" rx="25" fill="#dff7e8" />
  <text x="954" y="398" font-family="Arial, sans-serif" font-size="21" font-weight="700" fill="#36589a">Milestones</text>
  <text x="968" y="464" font-family="Arial, sans-serif" font-size="21" font-weight="700" fill="#8a5d27">Owners</text>
  <text x="927" y="530" font-family="Arial, sans-serif" font-size="21" font-weight="700" fill="#18794e">Delivery state</text>

  <rect x="1128" y="366" width="258" height="68" rx="26" fill="#f8d7d7" />
  <rect x="1128" y="454" width="258" height="68" rx="26" fill="#d7f0e3" />
  <text x="1217" y="408" font-family="Arial, sans-serif" font-size="19" font-weight="700" fill="#b91c1c">Risk</text>
  <text x="1226" y="496" font-family="Arial, sans-serif" font-size="19" font-weight="700" fill="#18794e">Fit</text>

  <rect x="1128" y="566" width="258" height="92" rx="26" fill="#ffffff" stroke="#d8e5ec" stroke-width="3" />
  <text x="1162" y="603" font-family="Arial, sans-serif" font-size="18" font-weight="700" fill="#334b5c">
    <tspan x="1162" dy="0">Delivery truth stays</tspan>
    <tspan x="1162" dy="24">at the center</tspan>
  </text>
</svg>
