<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" role="img" aria-labelledby="title desc">
  <title id="title">Software stack without overbuying illustration</title>
  <desc id="desc">An editorial illustration showing category choices, delayed purchases, and overbuying warnings with structured decision cues.</desc>
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f6fafc" />
      <stop offset="100%" stop-color="#eef6fb" />
    </linearGradient>
  </defs>
  <rect width="1600" height="900" fill="url(#bg)" />
  <circle cx="1260" cy="180" r="150" fill="#eaf6f4" />
  <rect x="140" y="130" width="1320" height="640" rx="42" fill="#ffffff" stroke="#d8e5ec" stroke-width="4" />

  <rect x="220" y="206" width="1160" height="132" rx="30" fill="#f8fafc" stroke="#d8e5ec" stroke-width="3" />
  <rect x="256" y="248" width="186" height="40" rx="20" fill="#d8f3f1" />
  <rect x="476" y="248" width="182" height="40" rx="20" fill="#dfe9fb" />
  <rect x="692" y="248" width="170" height="40" rx="20" fill="#fff0db" />
  <rect x="896" y="248" width="178" height="40" rx="20" fill="#ecfdf3" />
  <rect x="1108" y="248" width="186" height="40" rx="20" fill="#fee2e2" />
  <text x="300" y="273" font-family="Segoe UI, Arial, sans-serif" font-size="16" font-weight="700" fill="#0f766e">buy now</text>
  <text x="529" y="273" font-family="Segoe UI, Arial, sans-serif" font-size="16" font-weight="700" fill="#36589a">keep lean</text>
  <text x="748" y="273" font-family="Segoe UI, Arial, sans-serif" font-size="16" font-weight="700" fill="#8a5d27">delay</text>
  <text x="949" y="273" font-family="Segoe UI, Arial, sans-serif" font-size="16" font-weight="700" fill="#15803d">upgrade</text>
  <text x="1166" y="273" font-family="Segoe UI, Arial, sans-serif" font-size="16" font-weight="700" fill="#b91c1c">avoid</text>
  <rect x="256" y="302" width="1000" height="8" rx="4" fill="#dfe7ee" />
  <circle cx="340" cy="306" r="10" fill="#0f8b8d" />
  <circle cx="560" cy="306" r="10" fill="#7ea4df" />
  <circle cx="775" cy="306" r="10" fill="#d6a156" />
  <circle cx="986" cy="306" r="10" fill="#48b46c" />
  <circle cx="1200" cy="306" r="10" fill="#dc5f5f" />

  <rect x="220" y="390" width="290" height="270" rx="30" fill="#102430" />
  <rect x="550" y="390" width="320" height="270" rx="30" fill="#f8fbfd" stroke="#d8e5ec" stroke-width="3" />
  <rect x="910" y="390" width="470" height="270" rx="30" fill="#f8fbfd" stroke="#d8e5ec" stroke-width="3" />

  <text x="262" y="438" font-family="Segoe UI, Arial, sans-serif" font-size="24" font-weight="700" fill="#d6faf5">Minimum stack</text>
  <rect x="262" y="456" width="180" height="20" rx="10" fill="#d6faf5" opacity=".16" />
  <rect x="262" y="502" width="200" height="30" rx="15" fill="#d6faf5" opacity=".12" />
  <rect x="262" y="548" width="200" height="30" rx="15" fill="#d6faf5" opacity=".12" />
  <rect x="262" y="594" width="200" height="30" rx="15" fill="#d6faf5" opacity=".12" />
  <text x="294" y="522" font-family="Segoe UI, Arial, sans-serif" font-size="14" font-weight="700" fill="#d6faf5">PM / CRM</text>
  <text x="294" y="568" font-family="Segoe UI, Arial, sans-serif" font-size="14" font-weight="700" fill="#d6faf5">docs</text>
  <text x="294" y="614" font-family="Segoe UI, Arial, sans-serif" font-size="14" font-weight="700" fill="#d6faf5">invoice</text>

  <text x="592" y="438" font-family="Segoe UI, Arial, sans-serif" font-size="24" font-weight="700" fill="#122838">Decision filter</text>
  <rect x="592" y="456" width="176" height="20" rx="10" fill="#173042" opacity=".12" />
  <rect x="592" y="500" width="238" height="48" rx="18" fill="#ffffff" stroke="#d9e5ec" stroke-width="3" />
  <rect x="592" y="562" width="238" height="48" rx="18" fill="#ffffff" stroke="#d9e5ec" stroke-width="3" />
  <text x="624" y="530" font-family="Segoe UI, Arial, sans-serif" font-size="14" font-weight="700" fill="#334b5c">workflow bottleneck?</text>
  <text x="624" y="592" font-family="Segoe UI, Arial, sans-serif" font-size="14" font-weight="700" fill="#334b5c">second source of truth?</text>
  <rect x="742" y="510" width="56" height="22" rx="11" fill="#d8f3f1" />
  <rect x="748" y="572" width="50" height="22" rx="11" fill="#fee2e2" />
  <text x="760" y="525" font-family="Segoe UI, Arial, sans-serif" font-size="11" font-weight="700" fill="#0f766e">yes</text>
  <text x="761" y="587" font-family="Segoe UI, Arial, sans-serif" font-size="11" font-weight="700" fill="#b91c1c">no</text>

  <text x="952" y="438" font-family="Segoe UI, Arial, sans-serif" font-size="24" font-weight="700" fill="#122838">Category map</text>
  <rect x="952" y="456" width="178" height="20" rx="10" fill="#173042" opacity=".12" />
  <rect x="952" y="500" width="138" height="34" rx="17" fill="#d8f3f1" />
  <rect x="1106" y="500" width="138" height="34" rx="17" fill="#dfe9fb" />
  <rect x="1260" y="500" width="90" height="34" rx="17" fill="#fff0db" />
  <text x="991" y="522" font-family="Segoe UI, Arial, sans-serif" font-size="13" font-weight="700" fill="#0f766e">client</text>
  <text x="1140" y="522" font-family="Segoe UI, Arial, sans-serif" font-size="13" font-weight="700" fill="#36589a">schedule</text>
  <text x="1287" y="522" font-family="Segoe UI, Arial, sans-serif" font-size="13" font-weight="700" fill="#8a5d27">ops</text>
  <rect x="952" y="556" width="356" height="54" rx="22" fill="#ffffff" stroke="#d9e5ec" stroke-width="3" />
  <rect x="952" y="626" width="210" height="24" rx="12" fill="#fee2e2" />
  <rect x="1178" y="626" width="130" height="24" rx="12" fill="#ecfdf3" />
  <text x="986" y="589" font-family="Segoe UI, Arial, sans-serif" font-size="14" font-weight="700" fill="#334b5c">automation only after repeat workflow</text>
  <text x="979" y="643" font-family="Segoe UI, Arial, sans-serif" font-size="12" font-weight="700" fill="#b91c1c">duplicate tools</text>
  <text x="1204" y="643" font-family="Segoe UI, Arial, sans-serif" font-size="12" font-weight="700" fill="#15803d">upgrade later</text>
</svg>
