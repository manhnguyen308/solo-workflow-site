  <text x="276" y="628" font-family="Segoe UI, Arial, sans-serif" font-size="14" font-weight="700" fill="#8a5d27">invoice</text>
  <text x="484" y="628" font-family="Segoe UI, Arial, sans-serif" font-size="14" font-weight="700" fill="#18794e">schedule</text>
