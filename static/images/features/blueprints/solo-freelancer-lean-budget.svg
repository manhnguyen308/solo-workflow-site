  <text x="780" y="639" font-family="Segoe UI, Arial, sans-serif" font-size="14" font-weight="700" fill="#334b5c">manual step repeats daily</text>
  <circle cx="950" cy="573" r="10" fill="#0f8b8d" />
  <circle cx="950" cy="633" r="10" fill="#0f8b8d" />

  <rect x="1064" y="438" width="350" height="268" rx="32" fill="#f8fbfd" stroke="#d9e5ec" stroke-width="3" />
  <text x="1104" y="488" font-family="Segoe UI, Arial, sans-serif" font-size="24" font-weight="700" fill="#122838">Do not buy yet</text>
