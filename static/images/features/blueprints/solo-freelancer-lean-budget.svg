  <rect x="1064" y="308" width="314" height="52" rx="26" fill="#ecfdf3" />
  <text x="395" y="340" font-family="Segoe UI, Arial, sans-serif" font-size="15" font-weight="700" fill="#0f766e">starter</text>
  <text x="639" y="340" font-family="Segoe UI, Arial, sans-serif" font-size="15" font-weight="700" fill="#36589a">stable</text>
  <text x="886" y="340" font-family="Segoe UI, Arial, sans-serif" font-size="15" font-weight="700" fill="#8a5d27">growing</text>
  <text x="1160" y="340" font-family="Segoe UI, Arial, sans-serif" font-size="15" font-weight="700" fill="#18794e">upgrade only when pressure repeats</text>

