  <text x="1299" y="571" font-family="Segoe UI, Arial, sans-serif" font-size="13" font-weight="700" fill="#b91c1c">ops suite</text>
  <text x="1138" y="626" font-family="Segoe UI, Arial, sans-serif" font-size="14" font-weight="700" fill="#334b5c">extra software before repeat need</text>
