<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" role="img" aria-labelledby="title desc">
  <title id="title">Solo freelancer lean budget blueprint illustration</title>
  <desc id="desc">An editorial blueprint illustration showing a lean stack map, stage-based layers, upgrade triggers, and overbuying boundaries for a solo freelancer setup.</desc>
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f6fafc" />
      <stop offset="100%" stop-color="#edf4fb" />
    </linearGradient>
    <linearGradient id="navy" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#17355f" />
      <stop offset="100%" stop-color="#224f86" />
    </linearGradient>
  </defs>
  <rect width="1600" height="900" fill="url(#bg)" />
  <circle cx="1286" cy="196" r="154" fill="#e2eefb" />
  <circle cx="278" cy="712" r="144" fill="#e9f6f3" />

